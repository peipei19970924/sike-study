  }
  function evHtml(c) {
    var e = evOf(c);
    return '<span class="ev e' + e[0] + '" data-tip="' + esc(e[1] || "未标注依据") + '">证据 ' + e[0] + "</span>";
  }
  function evNote(c) {
    var e = evOf(c);
    return '<div class="ev-note"><b>依据</b>　' + esc(e[1] || "未标注") +
      '　<span class="dim2">A 强证据 / B 中等 / C 有限</span></div>';
  }
  function ageHtml(c) { return c.age ? '<span class="age">' + esc(c.age) + " 岁</span>" : ""; }
  function updHtml(c) { var y = UPDM[c.id]; return y ? '<span class="upd">↑ ' + y + " 更新</span>" : ""; }
  function metaRow(c) {
    var h = '<div class="metarow">' + evHtml(c) + ageHtml(c) + updHtml(c);
    if (KEYM[c.id]) h += '<span class="key-mark">必会</span>';
    return h + "</div>";
  }
  var AGES = (function () {
    var seen = {}, out = [];
    CARDS.forEach(function (c) { if (c.age && !seen[c.age]) { seen[c.age] = 1; out.push(c.age); } });
    out.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
    return out;
  })();

  /* ---------- 日期 ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function addDays(s, n) {
    var p = s.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return dstr(d);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  /* ---------- 状态 ---------- */
  function blankState() {
    return {
      v: 1,
      cards: {},
      log: {},
      streak: { last: "", days: 0 },
      settings: { newPerDay: 3 },
      created: today()
    };
  }
  var S = load();

  function load() {
    var d = blankState();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return d;
      var o = JSON.parse(raw);
      if (o && typeof o === "object") {
        if (o.cards) d.cards = o.cards;
        if (o.log) d.log = o.log;
        if (o.streak) d.streak = o.streak;
        if (o.settings) d.settings = Object.assign(d.settings, o.settings);
        if (o.created) d.created = o.created;
      }
    } catch (e) { /* 坏数据就当新的 */ }
    return d;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("保存失败：浏览器存储被禁用"); }
  }
  function st(id) {
    if (!S.cards[id]) S.cards[id] = { box: 0, due: null, seen: 0, ok: 0, bad: 0, lapses: 0, note: "", last: null };
    return S.cards[id];
  }
  function logOf(d) {
    if (!S.log[d]) S.log[d] = { new: 0, rev: 0, ok: 0, bad: 0 };
    return S.log[d];
  }

  /* ---------- 队列 ---------- */
  function dueList() {
    var t = today();
    return CARDS.filter(function (c) {
      var s = S.cards[c.id];
      return s && s.box > 0 && s.due && s.due <= t;
    }).sort(function (a, b) {
      return (S.cards[a.id].due < S.cards[b.id].due) ? -1 : 1;
    });
  }
  function freshList() {
    return CARDS.filter(function (c) {
      var s = S.cards[c.id];
      return !s || s.box === 0;
    }).sort(function (a, b) {
      var oa = SUBS.findIndex(function (x) { return x.s === a.s; });
      var ob = SUBS.findIndex(function (x) { return x.s === b.s; });
      return (a.lv - b.lv) || (oa - ob) || (a.id < b.id ? -1 : 1);
    });
  }
  function newRoom() {
    var t = today();
    var done = S.log[t] ? S.log[t].new : 0;
    return Math.max(0, S.settings.newPerDay - done);
  }
  function queue() {
    return { due: dueList(), fresh: freshList().slice(0, newRoom()) };
  }

  /* ---------- 会话 ---------- */
  var view = "home";
  var sess = null;
  var filters = { q: "", sub: "all", state: "all", age: "all" };
  var openId = null;

  var EXTRA = 5;
  function startSession(mode, n) {
    var items = [];
    var k = n || 0;
    if (mode === "free") {
      var pool = CARDS.filter(function (c) { var s = S.cards[c.id]; return s && s.box > 0; });
      if (!pool.length) pool = CARDS.slice();
      pool = pool.sort(function () { return Math.random() - 0.5; }).slice(0, k || 10);
      pool.forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
    } else if (mode === "more") {
      k = k || EXTRA;
      freshList().slice(0, k).forEach(function (c) { items.push({ id: c.id, type: "new" }); });
      var room = k - items.length;
      if (room > 0) dueList().slice(0, room).forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
      if (!items.length) {
        CARDS.slice().sort(function (a, b) { return (st(a.id).due || "") < (st(b.id).due || "") ? -1 : 1; })
          .slice(0, k).forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
      }
    } else {
      dueList().slice(0, 40).forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
      queue().fresh.forEach(function (c) { items.push({ id: c.id, type: "new" }); });
    }
    if (!items.length) { toast("今天没有任务，试试自由复习"); return; }
    sess = { items: items, i: 0, answered: false, picked: -1, stage: "read", results: [] };
    if (items[0].type === "rev") sess.stage = "quiz";
    view = "study";
    render();
  }

  function cur() { return sess.items[sess.i]; }

  function answer(idx) {
    if (!sess || sess.stage !== "quiz" || sess.answered) return;
    if (idx !== 0 && idx !== 1 && idx !== 2) return;
    var it = cur(); var c = MAP[it.id]; var s = st(c.id);
    var t = today(); var lg = logOf(t);
    sess.answered = true; sess.picked = idx;
    var ok = idx === c.q.i;
    s.seen = (s.seen || 0) + 1; s.last = t;
    if (ok) {
      s.ok = (s.ok || 0) + 1;
      s.box = Math.min((s.box || 0) + 1, 6);
      s.due = addDays(t, IV[s.box - 1]);
      lg.ok++;
    } else {
      s.bad = (s.bad || 0) + 1;
      s.lapses = (s.lapses || 0) + 1;
      s.box = 1;
      s.due = addDays(t, 1);
      lg.bad++;
    }
    if (it.type === "new") lg.new++; else lg.rev++;
    sess.results.push({ id: c.id, ok: ok });
    recordStudy();
    save();
    render(); // 重绘以显示反馈（保留 answered 状态）
  }

  function recordStudy() {
    var t = today();
    if (S.streak.last === t) return;
    if (S.streak.last === addDays(t, -1)) S.streak.days = (S.streak.days || 0) + 1;
    else S.streak.days = 1;
    S.streak.last = t;
  }

  function nextCard() {
    if (!sess.answered && sess.stage === "quiz") { toast("先选一个答案"); return; }
    sess.i++;
    sess.answered = false; sess.picked = -1;
    if (sess.i >= sess.items.length) { sess.done = true; render(); return; }
    sess.stage = sess.items[sess.i].type === "new" ? "read" : "quiz";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- 计算 ---------- */
  function mastery(sub) {
    var list = CARDS.filter(function (c) { return !sub || c.s === sub; });
    var m = list.filter(function (c) { var s = S.cards[c.id]; return s && s.box >= 3; }).length;
    var started = list.filter(function (c) { var s = S.cards[c.id]; return s && s.box > 0; }).length;
    return { m: m, started: started, total: list.length };
  }
  function todayStat() {
    var lg = logOf(today());
    var n = lg.ok + lg.bad;
    return { n: n, acc: n ? Math.round(lg.ok / n * 100) : 0, neu: lg.new, rev: lg.rev };
  }

  /* ---------- 渲染 ---------- */
  var app;
  function render() {
    app = document.getElementById("app");
    if (view === "study" && sess) app.innerHTML = sess.done ? viewDone() : viewStudy();
    else if (view === "lib") app.innerHTML = viewLib();
    else if (view === "skim") app.innerHTML = viewSkim();
    else if (view === "stats") app.innerHTML = viewStats();
    else app.innerHTML = viewHome();
    document.querySelectorAll("[data-tab]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === view);
    });
    syncSheet();
  }

  function dot(s) { return SUBCOLOR[s] || "#888"; }
  function tag(s) {
    return '<span class="tag" style="color:' + dot(s) + ';background:' + dot(s) + '1f">' + s + "</span>";
  }

  function restTip() {
    var n = todayStat().n;
    if (n < 24) return "";
    return '<div class="hook rest"><span class="hk">今天的量够了</span><span class="ht">你已经学了 ' + n +
      " 张。这时候再刷，边际收益明显下降——记忆主要在睡眠里巩固，明早再来一遍比现在硬撑更牢。</span></div>";
  }

  function viewHome() {
    var q = queue();
    var n = q.due.length + q.fresh.length;
    var ts = todayStat();
    var ma = mastery(null);
    var html = "";
    var doneN = ts.n, tgt = ts.n + n;
    var pct = tgt ? doneN / tgt * 100 : 100;
    html += '<div class="card hero">';
    html += '<div class="row hero-top"><span class="chip"><span class="dot" style="background:var(--acc)"></span>今日任务</span>' +
      '<span class="spacer"></span><span class="dim2" style="font-size:12.5px">' + today() + "</span></div>";
    html += '<div class="hero-main"><div class="hero-txt">';
    if (n > 0) {
      html += '<div class="h1">今天还有 <em class="bignum">' + n + "</em> 张</div>";
      html += '<div class="muted">新卡 <b class="c-fit">' + q.fresh.length + '</b> 张 · 到期复习 <b class="c-acc">' + q.due.length + "</b> 张</div>";
    } else {
      html += '<div class="h1">今天的任务已完成 ✓</div>';
      html += '<div class="muted">想加练？可以自由复习，或去卡片库翻专题。</div>';
    }
    html += '<div class="stat">' +
      '<div><div class="k">连续打卡</div><div class="v">' + (S.streak.days || 0) + '<span class="u"> 天</span></div></div>' +
      '<div><div class="k">已掌握</div><div class="v">' + ma.m + '<span class="u">/' + ma.total + "</span></div></div>" +
      '<div><div class="k">今日已学</div><div class="v">' + ts.n + "</div></div>" +
      '<div><div class="k">今日正确率</div><div class="v">' + (ts.n ? ts.acc + '<span class="u">%</span>' : "—") + "</div></div>" +
      "</div>";
    html += "</div><div class=\"hero-ring\">" + ring(pct, doneN + "/" + tgt, "今日完成") + "</div></div>";
    html += '<div style="margin-top:16px">';
    if (n > 0) {
      html += '<button class="btn primary wide" data-act="start">开始今天的学习 →</button>';
      html += '<div style="height:8px"></div><button class="btn wide ghost" data-act="more">还有劲？继续学 5 张</button>';
    } else {
      html += '<button class="btn primary wide" data-act="more">还有劲？继续学 5 张</button>';
      html += '<div style="height:8px"></div><button class="btn wide ghost" data-act="free">自由复习 10 张</button>';
    }
    html += "</div>";
    html += '<div class="hint">今日新卡额度 <span class="kbd">' + (S.settings.newPerDay >= 999 ? "不限" : S.settings.newPerDay) +
      '</span> 张（今天还可学 <span class="kbd">' + newRoom() + '</span> 张，全书还剩 <span class="kbd">' + freshList().length +
      '</span> 张没学）。额度用完也能点「继续学」随时加练。节奏去「数据」页调。</div>';
    html += '<div class="hint">记录只存在你当前这台设备的浏览器里：同一个网址，你和别人各自从 0 开始，互相看不到对方的进度。</div>';
    html += "</div>";

    // 四科进度
    html += '<div class="card" style="margin-top:14px"><div class="h2">五科进度</div>';
    SUBS.forEach(function (x) {
      var p = mastery(x.s);
      var pct = Math.round(p.started / p.total * 100);
      html += '<div class="subj-line"><div class="nm" style="color:' + x.c + '">' + x.s + "</div>" +
        '<div class="bar"><i style="width:' + pct + '%;background:' + x.c + '"></i></div>' +
        '<div class="pc">' + p.started + "/" + p.total + " · 掌握" + p.m + "</div></div>";
    });
    html += '<div class="hint">进度 = 已学过的卡；「掌握」= 连续答对进入长期复习（box≥3）。</div></div>';

    // 下一步
    var nx = freshList()[0];
    if (nx) {
      html += '<div class="card" style="margin-top:14px"><div class="row"><div class="h2" style="margin:0">下一张新卡</div><span class="spacer"></span>' + tag(nx.s) +
        '<span class="chip">L' + nx.lv + "</span></div>" +
        '<div style="margin-top:10px;font-weight:700;font-size:15.5px">' + esc(nx.t) + "</div>" +
        '<div class="muted" style="margin-top:4px;font-size:13px">' + esc(nx.b.slice(0, 46)) + "…</div></div>";
    }

    html += '<div class="card" style="margin-top:14px"><div class="h2">怎么用（30 秒版）</div>' +
      '<ol style="margin:0;padding-left:20px;color:#cfd9e6;font-size:14px;line-height:1.95">' +
      "<li>每天打开，点「开始今天的学习」——系统已排好该复习哪些、新学哪几张。</li>" +
      "<li>新卡先读讲解，再答一道自测；复习卡直接答，答完回看讲解。</li>" +
      "<li>答错不用怕，它会在明天、两天后、四天后反复出现，直到你记牢。</li>" +
      "<li>每个科目 L1→L3 渐进；学完想去线下练，看对应科目最后一课的路线图。</li>" +
      "<li>想先建立整体骨架，去「速览」看必会卡与前沿更新，再决定学哪科。</li></ol>" +
      '<div class="hint">键盘：<span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span> 选项，<span class="kbd">空格</span> 下一张，<span class="kbd">Esc</span> 关闭详情。</div></div>';

    return html;
  }

  function viewStudy() {
    var it = cur(); var c = MAP[it.id]; var s = st(c.id);
    var total = sess.items.length, idx = sess.i;
    var html = '<div class="card study fadein">';
    html += '<div class="study-head">' + tag(c.s) + '<span class="chip">L' + c.lv + "</span>" +
      '<span class="q-tag">' + (it.type === "new" ? "新卡" : "复习") + "</span>" +
      '<span class="spacer"></span><span class="dim2" style="font-size:12px">' + (idx + 1) + " / " + total + "</span></div>";
    html += '<div class="prog" style="border-radius:0;border:0;height:4px"><i style="width:' + (idx / total * 100) + '%"></i></div>';

    if (sess.stage === "read") {
      html += '<div class="title">' + esc(c.t) + "</div>";
      html += metaRow(c);
      html += hookHtml(c);
      html += '<div class="body">' + esc(c.b) + "</div>";
      html += '<ul class="pts">' + c.p.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
      if (c.m) html += '<div class="mis"><b>常见误区　</b>' + esc(c.m) + "</div>";
      html += egHtml(c);
      html += '<div class="q-wrap"><button class="btn primary wide" data-act="toquiz">读完，做 1 道自测 →</button>' +
        '<div class="hint">先试着用自己的话复述上面的要点，再点按钮。</div></div>';
      html += "</div>";
      return html;
    }

    // quiz
    html += '<div class="title" style="font-size:19px">' + esc(c.t) + "</div>";
    html += '<div class="q-wrap" style="border-top:0;margin-top:6px">';
    html += '<div class="q-ask">' + esc(c.q.a) + "</div>";
    c.q.o.forEach(function (o, i) {
      var cls = "opt";
      if (sess.answered) {
        cls += " lock";
        if (i === c.q.i) cls += " correct";
        else if (i === sess.picked) cls += " wrong";
      }
      html += '<button class="' + cls + '" data-act="opt" data-i="' + i + '"><span class="key">' + "ABC"[i] + "</span>" + esc(o) + "</button>";
    });
    if (sess.answered) {
      var ok = sess.picked === c.q.i;
      html += '<div class="fb ' + (ok ? "ok" : "no") + '"><b>' + (ok ? "答对了 ✓" : "答错了 ✗") + "</b>" + esc(c.q.w) + "</div>";
      html += evNote(c);
      html += hookHtml(c);
      html += '<div style="margin-top:14px"><button class="btn primary wide" data-act="next">' +
        (sess.i + 1 >= total ? "完成本次学习 →" : "下一张 →") + "</button>";
      html += '<div class="hint">下次复习：' + (s.due || "—") + "（box " + s.box + "）</div></div>";
      html += '<details class="acc" style="margin-top:10px"><summary>展开完整讲解</summary>' +
        '<div class="body" style="padding:10px 0 0">' + esc(c.b) + "</div>" +
        '<ul class="pts" style="margin:10px 0 0">' + c.p.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" + egHtml(c) + "</details>";
    } else {
      html += '<div class="hint">先自己想 5 秒，再选。蒙对了不算会——系统按「答对一次」记，但你可以用笔记写下不确定的地方。</div>';
    }
    html += "</div></div>";
    return html;
  }

  function viewDone() {
    var ok = sess.results.filter(function (r) { return r.ok; }).length;
    var n = sess.results.length;
    var acc = n ? Math.round(ok / n * 100) : 0;
    var nd = dueList().length;
    var html = '<div class="card done fadein">';
    html += '<div class="done-ring">' + ring(acc, acc + "%", "本次正确率") + "</div>";
    html += '<div class="big">' + (acc >= 80 ? "🎯" : acc >= 50 ? "💪" : "🌱") + "</div>";
    html += '<div class="h1">本次完成 ' + n + " 张</div>";
    html += '<div class="muted">答对 ' + ok + " 张 · 正确率 " + acc + "%</div>";
    html += '<div class="hr"></div>';
    html += '<div class="muted" style="font-size:13.5px">明日到期复习约 ' + nd + " 张。间隔重复的意义在于：忘了不要紧，它还会回来。</div>";
    html += '<div class="stat" style="max-width:420px;margin:18px auto 0">' +
      '<div><div class="k">连续打卡</div><div class="v">' + (S.streak.days || 0) + "</div></div>" +
      '<div><div class="k">已掌握</div><div class="v">' + mastery(null).m + "</div></div>" +
      '<div><div class="k">今日总学</div><div class="v">' + todayStat().n + "</div></div>" +
      '<div><div class="k">正确率</div><div class="v">' + todayStat().acc + "%</div></div></div>";
    html += restTip();
    html += '<div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<button class="btn primary" data-act="more">还有劲？再学 5 张 →</button>' +
      '<button class="btn" data-act="free">自由复习 10 张</button>' +
      '<button class="btn ghost" data-act="home">今天到此为止</button></div>';
    html += '<div class="hint" style="text-align:center;margin-top:10px">学多学少都算数，但记忆主要在睡眠里巩固——别指望一口气学完，每天来一遍最省力。</div>';
    html += "</div>";
    return html;
  }

  function viewLib() {
    var list = CARDS.filter(function (c) {
      if (filters.sub !== "all" && c.s !== filters.sub) return false;
      if (filters.age !== "all" && c.age !== filters.age) return false;
      var s = S.cards[c.id];
      var box = s ? s.box : 0;
      if (filters.state === "new" && box !== 0) return false;
      if (filters.state === "learning" && !(box > 0 && box < 3)) return false;
      if (filters.state === "mastered" && !(box >= 3)) return false;
      if (filters.q) {
        var q = filters.q.toLowerCase();
        var hay = (c.t + c.b + c.p.join("") + c.s + (s && s.note ? s.note : "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    var html = '<div class="row"><div class="h1" style="margin:0">卡片库</div>' +
      '<span class="spacer"></span><span class="dim2" style="font-size:13px">共 ' + CARDS.length + " 张</span></div>";
    html += '<div class="tools"><input type="search" id="qbox" placeholder="搜索关键词，如 渐进、刺拳、蛋白、肩袖…" value="' + esc(filters.q) + '">' +
      '<select class="sel" id="subsel">' +
      '<option value="all">全部科目</option>' +
      SUBS.map(function (x) { return '<option value="' + x.s + '"' + (filters.sub === x.s ? " selected" : "") + ">" + x.s + "</option>"; }).join("") +
      "</select>" +
      '<select class="sel" id="statesel">' +
      '<option value="all">全部状态</option><option value="new"' + (filters.state === "new" ? " selected" : "") + ">未学</option>" +
      '<option value="learning"' + (filters.state === "learning" ? " selected" : "") + ">学习中</option>" +
      '<option value="mastered"' + (filters.state === "mastered" ? " selected" : "") + ">已掌握</option></select>" +
      '<select class="sel" id="agesel"><option value="all">全部年龄</option>' +
      AGES.map(function (a) { return '<option value="' + a + '"' + (filters.age === a ? " selected" : "") + ">" + a + " 岁</option>"; }).join("") +
      "</select></div>";
    if (!list.length) html += '<div class="card muted" style="text-align:center;padding:30px">没有匹配的卡片</div>';
    html += '<div class="list">';
    list.forEach(function (c) {
      var s = S.cards[c.id] || { box: 0 };
      var stTxt = s.box === 0 ? "未学" : s.box >= 3 ? "已掌握" : "学习中（box " + s.box + "）";
      html += '<div class="item" data-act="open" data-id="' + c.id + '">' + tag(c.s) +
        '<div style="flex:1"><div class="tt">' + esc(c.t) + '</div>' + metaRow(c) +
        '<div class="isub">' + esc(c.b.length > 46 ? c.b.slice(0, 46) + "…" : c.b) + '</div>' +
        '<div class="meta">L' + c.lv + " · " + stTxt +
        (s.due ? " · 下次 " + s.due : "") + (s.note ? " · 有笔记" : "") + "</div></div></div>";
    });
    html += "</div>";
    return html;
  }

  function viewSkim() {
    var keys = CARDS.filter(function (c) { return KEYM[c.id]; });
    var html = '<div class="row"><div class="h1" style="margin:0">速览</div><span class="spacer"></span>' +
      '<span class="dim2" style="font-size:13px">' + keys.length + " 张必会</span></div>";
    html += '<div class="hint">先看必会卡建立骨架，再去「学习」逐张过。每张卡都标了证据等级：A 强 / B 中等 / C 有限。</div>';

    SUBS.forEach(function (x) {
      var ks = keys.filter(function (c) { return c.s === x.s; });
      if (!ks.length) return;
      html += '<div class="card" style="margin-top:14px"><div class="row"><div class="h2" style="margin:0;color:' + x.c + '">' + x.s + "</div>" +
        '<span class="spacer"></span><span class="dim2" style="font-size:12px">' + ks.length + " 张必会</span></div>";
      ks.forEach(function (c) {
        html += '<div class="skim" data-act="open" data-id="' + c.id + '"><div class="st">' + esc(c.t) + evHtml(c) + "</div>" +
          '<div class="sp">' + esc(c.p[0]) + "</div></div>";
      });
      html += "</div>";
    });

    html += '<div class="card" style="margin-top:14px"><div class="row"><div class="h2" style="margin:0">前沿速递</div>' +
      '<span class="spacer"></span><span class="dim2" style="font-size:12px">截至 2025 年整理</span></div>';
    html += '<div class="hint" style="margin-top:6px">这些是近年有实质更新的结论。标「证据 A」说明已写入主流指南，可放心执行。</div>';
    FRESH.slice().sort(function (a, b) { return b.y - a.y; }).forEach(function (f) {
      var c = MAP[f.card];
      html += '<div class="fresh" data-act="open" data-id="' + f.card + '">' +
        '<div class="fy">' + f.y + "</div>" +
        '<div class="fmain"><div class="st">' + esc(f.t) + '<span class="ev e' + f.ev + '">证据 ' + f.ev + "</span></div>" +
        '<div class="sp">' + esc(f.b) + "</div>" +
        (c ? '<div class="fl">对应卡片：' + esc(c.t) + "</div>" : "") + "</div></div>";
    });
    html += "</div>";
    return html;
  }

  function viewStats() {
    var ma = mastery(null);
    var html = '<div class="row"><div class="h1" style="margin:0">数据</div><span class="spacer"></span>' +
      '<span class="dim2" style="font-size:13px">开始于 ' + S.created + "</span></div>";

    // 热力图
    html += '<div class="card" style="margin-top:14px"><div class="row"><div class="h2" style="margin:0">最近 12 周</div>' +
      '<span class="spacer"></span><span class="dim2" style="font-size:12px">每格一天，越亮学得越多</span></div>';
    html += '<div class="heat">' + heatCells() + "</div></div>";

    // 概览
    var totalSeen = 0, totalOk = 0, totalBad = 0;
    Object.keys(S.cards).forEach(function (k) { totalSeen += S.cards[k].seen || 0; totalOk += S.cards[k].ok || 0; totalBad += S.cards[k].bad || 0; });
    html += '<div class="card" style="margin-top:14px"><div class="h2">总览</div><div class="stat">' +
      '<div><div class="k">累计答题</div><div class="v">' + totalSeen + "</div></div>" +
      '<div><div class="k">累计正确</div><div class="v">' + totalOk + "</div></div>" +
      '<div><div class="k">累计答错</div><div class="v">' + totalBad + "</div></div>" +
      '<div><div class="k">掌握率</div><div class="v">' + Math.round(ma.m / ma.total * 100) + "%</div></div></div>";
    SUBS.forEach(function (x) {
      var p = mastery(x.s);
      html += '<div class="subj-line"><div class="nm" style="color:' + x.c + '">' + x.s + "</div>" +
        '<div class="bar"><i style="width:' + Math.round(p.m / p.total * 100) + '%;background:' + x.c + '"></i></div>' +
        '<div class="pc">掌握 ' + p.m + "/" + p.total + "</div></div>";
    });
    html += "</div>";

    // 易错
    var weak = CARDS.filter(function (c) { var s = S.cards[c.id]; return s && s.bad > 0; })
      .sort(function (a, b) { return (S.cards[b.id].bad - S.cards[a.id].bad); }).slice(0, 6);
    html += '<div class="card" style="margin-top:14px"><div class="h2">最该重看的卡（按答错次数）</div>';
    if (!weak.length) html += '<div class="muted" style="font-size:13.5px">还没有答错记录，继续保持。</div>';
    weak.forEach(function (c) {
      html += '<div class="weak" data-act="open" data-id="' + c.id + '" style="cursor:pointer">' + tag(c.s) +
        '<span style="flex:1">' + esc(c.t) + "</span><span class=\"n\">错 " + S.cards[c.id].bad + " 次</span></div>";
    });
    html += "</div>";

    // 设置
    html += '<div class="card" style="margin-top:14px"><div class="h2">设置</div>';
    html += '<div class="row" style="margin-bottom:10px"><span style="font-size:14px">每天新卡数量</span><span class="spacer"></span>' +
      '<select class="sel" id="newsel">' + [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 999].map(function (n) {
        return '<option value="' + n + '"' + (S.settings.newPerDay === n ? " selected" : "") + ">" + (n >= 999 ? "不限（有劲就学）" : n + " 张") + "</option>";
      }).join("") + "</select></div>";
    html += '<div class="hint" style="margin:0 0 8px">共 ' + CARDS.length + " 张卡" +
      (S.settings.newPerDay >= 999 ? "；额度已设为不限——想学多少学多少，「开始今天的学习」会一直给新卡。" :
        "；按每天 " + S.settings.newPerDay + " 张算，约 " + Math.ceil(CARDS.length / S.settings.newPerDay) + " 天学完第一遍，之后进入复习循环（最长间隔 30 天）。") + "</div>";
    html += '<div class="hint" style="margin:0 0 12px">不管额度设多少，首页和完成页的「继续学 5 张」都能随时加练；加练的新卡照样进间隔重复队列，不会因为多学就记不牢。</div>';
    html += '<div class="row"><button class="btn sm" data-act="export">导出备份 JSON</button>' +
      '<label class="btn sm" style="cursor:pointer">导入备份<input type="file" id="imp" accept=".json" style="display:none"></label>' +
      '<span class="spacer"></span><button class="btn sm" data-act="reset">清空进度</button></div>';
    html += '<div class="hint">备份文件含有全部学习进度与笔记。换电脑、换浏览器时导入即可继续。</div></div>';

    // 记录与隐私
    html += '<div class="card" style="margin-top:14px"><div class="row"><div class="h2" style="margin:0">你的记录在哪</div>' +
      '<span class="spacer"></span><span class="chip">本机专属</span></div>';
    html += '<div class="hint" style="margin:8px 0 0">进度、笔记、错题都只保存在<b>这台设备、这个浏览器</b>里，不会上传，也不会给别人看。同一个二维码/网址给多少人扫，每个人打开都是自己的空白进度，各学各的。</div>';
    html += '<div class="hint" style="margin:8px 0 0">换设备接着学：在这里点「导出备份 JSON」，把文件传到新设备，再点「导入备份」。</div>';
    html += '<div class="hint" style="margin:8px 0 0">同一台手机换浏览器（比如微信里打开 vs 用浏览器打开）会被当成两台设备，进度不共享——固定一种打开方式即可。</div>';
    html += '<div class="hint" style="margin:8px 0 0">清理浏览器数据 / 无痕模式会清掉记录，重要进度记得导出备份。</div></div>';

    // 内容版本与更新记录
    html += '<div class="card" style="margin-top:14px"><div class="row"><div class="h2" style="margin:0">内容版本</div>' +
      '<span class="spacer"></span><span class="chip">' + VER.v + " · " + VER.d + "</span></div>";
    html += '<div class="hint" style="margin:8px 0 0">知识会变：指南修订、新共识出现时，卡片内容跟着改，版本号也会变。看到版本号变了，说明有值得重看的内容。</div>';
    (window.UPDLOG || []).forEach(function (u) {
      html += '<div class="updline"><span class="ud">' + u.d + "</span><b>" + esc(u.t) + "</b>" +
        '<div class="umuted">' + esc(u.b) + "</div></div>";
    });
    html += '<div class="hint">想快一点跟上前沿：只看「速览」页顶部的前沿速递，10 条，几分钟看完。</div></div>';

    html += '<div class="footer">五课学习中心 · 内容版本 ' + VER.v + '（' + VER.d + '）· 内容为一般性科普，不构成医疗、训练或营养处方。<br>身体不适请就医；训练请在有资质教练指导下进行。</div>';
    return html;
  }

  function heatCells() {
    var t = new Date();
    var end = dstr(t);
    var startD = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 83);
    // 对齐到周一
    var dow = (startD.getDay() + 6) % 7;
    startD = new Date(startD.getFullYear(), startD.getMonth(), startD.getDate() - dow);
    var cells = [];
    var d = startD;
    while (dstr(d) <= end) {
      var k = dstr(d);
      var lg = S.log[k];
      var n = lg ? (lg.new + lg.rev) : 0;
      var lv = n === 0 ? "" : n <= 2 ? "l1" : n <= 5 ? "l2" : n <= 9 ? "l3" : "l4";
      cells.push('<i class="' + lv + '" title="' + k + " · " + n + ' 张"></i>');
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
    return cells.join("");
  }

  /* ---------- 详情弹层 ---------- */
  function syncSheet() {
    var sheet = document.getElementById("sheet");
    if (!openId) { sheet.classList.remove("on"); sheet.innerHTML = ""; return; }
    var c = MAP[openId]; var s = st(c.id);
    var stTxt = s.box === 0 ? "未学" : s.box >= 3 ? "已掌握" : "学习中";
    sheet.innerHTML = '<div class="sheet-in">' +
      '<div class="row">' + tag(c.s) + '<span class="chip">L' + c.lv + '</span><span class="chip">' + stTxt + '</span>' +
      '<span class="spacer"></span><button class="btn sm ghost" data-act="close">关闭 ✕</button></div>' +
      '<div class="title" style="margin:14px 0 8px">' + esc(c.t) + "</div>" +
      metaRow(c) +
      hookHtml(c) +
      '<div class="body" style="padding:0">' + esc(c.b) + "</div>" +
      '<ul class="pts" style="margin:12px 0 0">' + c.p.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
      (c.m ? '<div class="mis"><b>常见误区　</b>' + esc(c.m) + "</div>" : "") +
      egHtml(c) +
      '<div class="hr"></div><div class="q-ask">自测</div><div class="muted" style="font-size:14px">' +
      esc(c.q.a) + "</div>" +
      '<div style="margin-top:8px;font-size:13.5px;color:var(--ok)">答案：' + "ABC"[c.q.i] + ". " + esc(c.q.o[c.q.i]) + "</div>" +
      '<div class="muted" style="font-size:13px;margin-top:4px">' + esc(c.q.w) + "</div>" +
      evNote(c) +
      '<div class="hr"></div><div class="h2" style="font-size:14px">我的笔记</div>' +
      '<textarea id="note" placeholder="写下你的理解、疑问、自己的例子…">' + esc(s.note || "") + "</textarea>" +
      '<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="savenote" data-id="' + c.id + '">保存笔记</button>' +
      '<span class="dim2" style="font-size:12px">答题 ' + (s.seen || 0) + " 次 · 对 " + (s.ok || 0) + " · 错 " + (s.bad || 0) +
      (s.due ? " · 下次 " + s.due : "") + "</span></div></div>";
    sheet.classList.add("on");
  }
  function closeSheet() { openId = null; syncSheet(); }

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2200);
  }

  /* ---------- 备份 ---------- */
  function exportData() {
    var blob = new Blob([JSON.stringify({ app: "sike-study", v: 1, exported: new Date().toISOString(), state: S }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "四课学习备份_" + today() + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast("已导出备份文件");
  }
  function importData(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        var s = o.state || o;
        if (!s.cards || typeof s.cards !== "object") throw new Error("bad");
        S = Object.assign(blankState(), s);
        save(); render(); toast("导入成功，共 " + Object.keys(S.cards).length + " 张卡的记录");
      } catch (e) { toast("文件格式不对，导入失败"); }
    };
    fr.readAsText(file);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) {
      if (e.target.id === "sheet") closeSheet();
      return;
    }
    var act = el.getAttribute("data-act");
    if (act === "start") startSession("day");
    else if (act === "free") startSession("free", 10);
    else if (act === "more") startSession("more", EXTRA);
    else if (act === "home") { sess = null; view = "home"; render(); }
    else if (act === "toquiz") { sess.stage = "quiz"; render(); }
    else if (act === "opt") { answer(Number(el.getAttribute("data-i"))); }
    else if (act === "next") nextCard();
    else if (act === "open") { openId = el.getAttribute("data-id"); syncSheet(); }
    else if (act === "close") closeSheet();
    else if (act === "savenote") {
      var id = el.getAttribute("data-id");
      var ta = document.getElementById("note");
      st(id).note = ta.value; save(); toast("笔记已保存");
    }
    else if (act === "export") exportData();
    else if (act === "reset") {
      if (confirm("确定清空全部学习进度与笔记吗？建议先导出备份。")) {
        S = blankState(); save(); render(); toast("已清空");
      }
    } else if (act === "tab") {
      var v = el.getAttribute("data-tab");
      if (v === "study" && (!sess || sess.done)) { sess = null; startSession("day"); return; }
      view = v; render();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "qbox") { filters.q = e.target.value; render(); var b = document.getElementById("qbox"); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "subsel") { filters.sub = e.target.value; render(); }
    if (e.target.id === "agesel") { filters.age = e.target.value; render(); }
    if (e.target.id === "statesel") { filters.state = e.target.value; render(); }
    if (e.target.id === "newsel") { S.settings.newPerDay = Number(e.target.value); save(); toast("每天新卡：" + S.settings.newPerDay + " 张"); }
    if (e.target.id === "imp" && e.target.files && e.target.files[0]) importData(e.target.files[0]);
  });

  document.addEventListener("keydown", function (e) {
    if (openId && e.key === "Escape") { closeSheet(); return; }
    if (view !== "study" || !sess || sess.done) return;
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    if (sess.stage === "read" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); sess.stage = "quiz"; render(); return; }
    if (sess.stage === "quiz") {
      if (!sess.answered && ["1", "2", "3"].indexOf(e.key) >= 0) { e.preventDefault(); answer(Number(e.key) - 1); return; }
      if (sess.answered && (e.key === " " || e.key === "Enter")) { e.preventDefault(); nextCard(); }
    }
  });

  // 标签切换按钮（顶栏）
  document.addEventListener("DOMContentLoaded", function () { render(); });

  window.__sikeRender = render;
  if (document.readyState !== "loading") render();
})();

</script>
</body>
</html>
