/* ===== 解剖 L1 方位与组织 ===== */
{id:"ana-01",s:"解剖",lv:1,t:"方位术语：解剖学的坐标",b:"解剖学以「解剖学姿势」为基准：直立、面向前、掌心向前。常用词：上/下、前/后、内侧（靠中线）/外侧（远离中线）、近端（靠躯干）/远端（远离躯干）、浅/深、同侧/对侧。会说这些词，才能听懂教练和医生的描述。",p:["内侧=靠近身体中线，外侧=远离中线","近端/远端只用于四肢，指离躯干远近","描述位置时先说基准，再说方向"],m:"把「内侧」理解成「身体里面」，和医生沟通时完全对不上。",q:{a:"「膝关节位于踝关节的近端」意思是？",o:["膝比踝更靠近躯干","膝比踝更靠下","膝在踝的外侧"],i:0,w:"近端指靠近躯干一端，膝在上方更靠近躯干，故为踝的近端。"}},
{id:"ana-02",s:"解剖",lv:1,t:"三个运动平面",b:"矢状面把身体分成左右，动作是屈/伸（深蹲、弯举）；额状面分成前后，动作是外展/内收/侧屈（侧平举）；水平面分成上下，动作是旋转/水平外展（转体、髋内外旋）。几乎所有动作都在三个平面里组合发生。",p:["屈伸在矢状面，侧向动作在额状面，旋转在水平面","深蹲是矢状面主导，但需要额状面稳定","训练计划里补上旋转与侧向，才不容易「只会前后动」"],m:"只做前后方向的动作，忽略了侧向与旋转能力。",q:{a:"哑铃侧平举主要发生在哪个平面？",o:["矢状面","额状面","水平面"],i:1,w:"手臂向身体侧面抬起，属外展，发生在额状面。"}},
{id:"ana-03",s:"解剖",lv:1,t:"关节类型与自由度",b:"球窝关节（肩、髋）三轴活动、最灵活也最不稳定；铰链关节（肘、膝）主要做屈伸；车轴关节（桡尺近端）做旋转；椭圆/鞍状关节（腕、拇指）多方向但幅度有限；平面关节（腕骨间）小幅滑动。关节结构决定它能做什么、也决定它的薄弱点。",p:["肩髋灵活但需稳定肌保护，肘膝稳定但怕侧向力","膝关节几乎只能屈伸，侧向受力容易伤韧带","了解关节类型，就知道哪些动作「不该硬掰」"],m:"拿肩关节的活动度去要求膝关节，硬掰出伤。",q:{a:"膝关节属于哪种关节？",o:["球窝关节","铰链关节","鞍状关节"],i:1,w:"膝关节主要完成屈伸，属铰链（改良铰链）关节。"}},
{id:"ana-04",s:"解剖",lv:1,t:"起点、止点与肌肉功能",b:"肌肉通过肌腱附着于骨。通常把靠近躯干、相对固定的附着点叫起点（origin），另一端叫止点（insertion）。肌肉收缩时把止点拉向起点。判断一块肌肉的功能，看它跨过哪个关节、从哪一侧跨过——跨过关节前方多负责屈，后方多负责伸。",p:["肌肉功能由「跨哪个关节、跨哪一侧」决定","同一块肌肉在不同姿势下可能产生不同动作","训练时想「它把哪块骨拉向哪」，比背名字有用"],m:"死记肌肉名字却不理解它跨过关节的方位，换个角度就不会用了。",q:{a:"判断一块肌肉的主要功能，最关键的依据是？",o:["它的名字","它跨过哪些关节、从关节的哪一侧通过","它的大小"],i:1,w:"肌肉的力线位置决定其动作功能，名字只是提示。"}},
{id:"ana-05",s:"解剖",lv:1,t:"三种收缩与实际应用",b:"向心收缩：肌肉缩短、克服阻力（推起）；离心收缩：肌肉被拉长但仍发力（下放），能承受更大负荷，是力量与增肌的重要刺激；等长收缩：长度不变（平板支撑）。日常动作几乎都是三者组合。",p:["离心能承受最大张力，所以「慢下放」有效","等长训练适合康复早期和稳定训练","只做向心（甩上去）会浪费一半刺激"],m:"把「发力」只理解成缩短，忽略离心阶段的训练价值。",q:{a:"缓慢下放哑铃的阶段属于？",o:["向心收缩","离心收缩","等长收缩"],i:1,w:"肌肉在受力状态下被拉长，是离心收缩。"}},
{id:"ana-06",s:"解剖",lv:1,t:"骨、关节与软骨",b:"骨提供杠杆与保护；关节面覆盖透明软骨，减少摩擦、缓冲压力；关节囊与韧带限制过度活动；滑膜分泌滑液润滑。软骨血供差，损伤后修复能力弱，所以「磨关节」的动作要谨慎，尤其是长期高负荷 + 不良对线。",p:["软骨靠关节活动「挤压-放松」获取营养，适度活动有益","韧带损伤后松弛，关节稳定性会长期下降","骨密度靠负重与冲击刺激维持"],m:"以为关节是「用久了必然磨损」，其实对线与负荷管理更关键。",q:{a:"关节软骨的营养主要依靠？",o:["血液直接渗透","关节活动时的挤压与放松循环","肌肉供血"],i:1,w:"软骨无血管，靠关节运动产生的压力变化进行物质交换。"}},
{id:"ana-07",s:"解剖",lv:1,t:"运动单位与募集顺序",b:"一个运动神经元及其支配的所有肌纤维构成一个运动单位。发力时遵循「大小原则」：先募集小（慢肌、耐力型）运动单位，力量需求增大再募集大的（快肌、力量型）。所以轻重量高次数练不到最大力量，大重量也练不出耐力。",p:["想练力量，必须让大运动单位被募集——需要足够大的负荷或速度","疲劳时募集阈值下降，轻重量也能「练到」但质量不同","神经适应是新手的第一次进步来源"],m:"以为「次数多就一定练到所有肌纤维」，忽略了负荷阈值。",q:{a:"按大小原则，发力增加时最先被募集的是？",o:["较大的快肌运动单位","较小的慢肌运动单位","同时全部募集"],i:1,w:"募集从小运动单位开始，随需求增加逐步召入更大的。"}},
{id:"ana-08",s:"解剖",lv:1,t:"筋膜与结缔组织",b:"筋膜是包裹肌肉、连接各层的结缔组织网，传递力量、提供本体感觉。肌腱把力传给骨，韧带连接骨与骨。结缔组织适应慢（比肌肉慢），所以负荷要渐进。所谓「筋膜放松」更多是短期改善活动度与感觉，不是「把筋膜揉开」。",p:["肌腱与韧带适应比肌肉慢，加负荷别急","泡沫轴主要改善短期活动度与舒适感","力量训练本身就在强化肌腱与筋膜"],m:"相信「筋膜粘连必须用力揉开」，越揉越痛。",q:{a:"连接骨与骨的结缔组织是？",o:["肌腱","韧带","筋膜"],i:1,w:"肌腱连接肌肉与骨，韧带连接骨与骨。"}},
/* ===== 解剖 L2 主要肌群 ===== */
{id:"ana-09",s:"解剖",lv:2,t:"胸大肌与「推」",b:"胸大肌起于锁骨内侧、胸骨与肋软骨，止于肱骨大结节嵴，功能是肩关节内收、内旋、水平内收，锁骨部还可屈肩。卧推、俯卧撑、飞鸟都练它，但不同角度侧重不同束。推的动作还需要前三角肌与肱三头肌协同。",p:["上斜刺激锁骨部，平板偏胸骨部，下斜偏下部","胸大肌也参与内旋，圆肩体态常与它紧张有关","推的极限不只取决于胸，还取决于三头与肩"],m:"只做平板卧推，上胸和肩部发展明显落后。",q:{a:"胸大肌的主要功能不包括？",o:["肩关节内收与内旋","肩关节水平内收","肩关节外旋"],i:2,w:"外旋主要由冈下肌、小圆肌等肩袖完成。"}},
{id:"ana-10",s:"解剖",lv:2,t:"背阔肌与「拉」",b:"背阔肌起于下胸椎、腰椎、髂嵴与下位肋骨，止于肱骨小结节嵴，功能是肩伸、内收、内旋。它把手臂「往下往身体拉」。引体、划船、高位下拉都练它。注意：背阔肌紧张会限制肩屈（举过头顶）。",p:["拉的动作要「用肘带」，想着肘往腰后走","背阔肌紧张是举臂受限的常见原因","划船偏水平拉（中背），下拉偏垂直拉（背阔）"],m:"拉的时候只用手臂弯举，背部几乎没参与。",q:{a:"背阔肌的主要功能是？",o:["肩关节屈曲","肩关节伸展、内收与内旋","肩关节外展"],i:1,w:"背阔肌把肱骨拉向躯干后方与内侧，是主要的「拉」肌。"}},
{id:"ana-11",s:"解剖",lv:2,t:"三角肌三束",b:"三角肌分前、中、后三束，都止于肱骨三角肌粗隆。前束屈肩（前平举、推举前段），中束外展（侧平举），后束水平外展与伸肩（反向飞鸟）。三束功能不同，训练要分开补，否则后束最容易落后。",p:["推举主要练前束，中束靠侧平举，后束靠反向飞鸟/面拉","后束弱是圆肩与肩前痛的常见因素","侧平举时小重量、控制离心，比甩大重量有效"],m:"只做推举和侧平举，后束长期缺席。",q:{a:"三角肌中束的主要功能是？",o:["肩关节外展","肩关节内旋","屈肘"],i:0,w:"中束位于肩外侧，收缩时把手臂向侧方抬起，即外展。"}},
{id:"ana-12",s:"解剖",lv:2,t:"肱二头肌与肱三头肌",b:"肱二头肌跨肩与肘两个关节，功能是屈肘、前臂旋后，长头还参与屈肩；肱三头肌是伸肘主力，长头跨肩参与伸肩。所以弯举时前臂旋后（掌心向上）能更多激活二头；臂屈伸时大臂保持固定，才专注三头。",p:["二头既是屈肘肌也是旋后肌","三头占上臂体积约 2/3，想手臂粗别只练二头","窄距卧推、双杠臂屈伸是高效三头复合动作"],m:"练手臂只做弯举，上臂围度上不去。",q:{a:"肱二头肌除了屈肘，还主要负责？",o:["前臂旋后","前臂旋前","伸肘"],i:0,w:"二头肌是强力的前臂旋后肌，这也是反握弯举更「有感觉」的原因。"}},
{id:"ana-13",s:"解剖",lv:2,t:"股四头肌与臀大肌",b:"股四头肌（股直肌、股外侧肌、股内侧肌、股中间肌）伸膝，其中股直肌跨髋还屈髋；臀大肌伸髋与外旋。深蹲、腿举、箭步蹲都同时用到；臀桥、罗马尼亚硬拉更偏髋主导。膝主导与髋主导的训练要搭配。",p:["伸膝靠股四头，伸髋靠臀与腘绳","臀大肌是人体最大的肌肉，决定髋伸力量","只做腿举不练髋铰链，臀部和后链会弱"],m:"练腿只会腿举，臀部和后侧链几乎没刺激。",q:{a:"臀大肌的主要功能是？",o:["髋关节伸展与外旋","髋关节屈曲","伸膝"],i:0,w:"臀大肌把大腿向后拉，是髋伸的主力，也参与外旋。"}},
{id:"ana-14",s:"解剖",lv:2,t:"腘绳肌与硬拉",b:"腘绳肌（半腱肌、半膜肌、股二头肌）跨髋与膝，功能是屈膝、伸髋。它既是膝屈肌又是髋伸肌，所以 RDL、腿弯举从两个方向练它。腘绳肌拉伤常见于冲刺和快速离心，热身与渐进离心训练能降低风险。",p:["RDL 练腘绳的离心与髋伸，腿弯举练屈膝","冲刺前必须充分热身腘绳肌","腘绳拉伤后复发率高，恢复要循序渐进"],m:"只做腿屈伸（股四头），腘绳肌完全不练。",q:{a:"腘绳肌的功能包括？",o:["屈膝和伸髋","伸膝和屈髋","只有屈膝"],i:0,w:"腘绳肌跨膝与髋两个关节，同时具备屈膝与伸髋功能。"}},
{id:"ana-15",s:"解剖",lv:2,t:"小腿三头肌与踝",b:"腓肠肌与比目鱼肌合称小腿三头肌，通过跟腱止于跟骨，功能是踝跖屈（踮脚）。腓肠肌跨膝，膝伸直时更吃力；比目鱼肌不跨膝，屈膝时仍能发力。踝背屈活动度不足会影响深蹲深度和落地缓冲。",p:["直腿提踵偏腓肠肌，屈膝提踵偏比目鱼肌","跟腱是人体最粗的肌腱，也需要渐进负荷","踝背屈受限时，深蹲容易脚跟离地"],m:"只练提踵不管踝活动度，深蹲始终蹲不下去。",q:{a:"哪块小腿肌肉在屈膝状态下仍能有效发力？",o:["腓肠肌","比目鱼肌","胫骨前肌"],i:1,w:"比目鱼肌不跨膝关节，屈膝时仍能有效跖屈踝关节。"}},
{id:"ana-16",s:"解剖",lv:2,t:"核心三层：腹直、腹斜、腹横",b:"腹直肌屈曲躯干（卷腹）；腹内/外斜肌负责旋转与侧屈；腹横肌是深层「束腰带」，通过增加腹内压稳定腰椎。三者功能不同，训练也应覆盖：卷腹/举腿、旋转（砍伐、俄罗斯转体）、抗伸展与抗旋转（平板、帕洛夫推）。",p:["腹横肌靠呼吸与腹内压训练，不是靠卷腹","旋转训练要控制速度，腰椎怕高速甩转","「核心」包括膈肌、盆底与多裂肌，不只腹肌"],m:"以为核心就是「六块腹肌」，只做卷腹。",q:{a:"腹横肌最主要的作用是？",o:["屈曲躯干","通过腹内压稳定腰椎","旋转躯干"],i:1,w:"腹横肌环绕腹部深层，收缩时提高腹内压，为脊柱提供稳定。"}},
/* ===== 解剖 L3 应用 ===== */
{id:"ana-17",s:"解剖",lv:3,t:"肩袖与肩关节稳定",b:"肩袖由冈上肌、冈下肌、小圆肌、肩胛下肌组成，把肱骨头「吸」在肩胛盂上。冈上肌外展启动，冈下肌与小圆肌外旋，肩胛下肌内旋。肩袖弱或疲劳时，肩关节在推举和过顶动作中最容易出问题。",p:["外旋训练（弹力带/侧卧外旋）是肩部健康的保险","过顶动作痛，先查肩袖与肩胛控制","肩袖练的是稳定，不是大重量"],m:"只练大重量推举，从不练外旋与肩胛稳定。",q:{a:"肩袖肌群中，负责肩关节外旋的主要是？",o:["冈上肌","冈下肌与小圆肌","肩胛下肌"],i:1,w:"冈下肌和小圆肌是主要的外旋肌，肩胛下肌则负责内旋。"}},
{id:"ana-18",s:"解剖",lv:3,t:"膝关节的力学与韧带",b:"膝关节主要做屈伸，轻微旋转。前交叉韧带（ACL）限制胫骨前移，后交叉限制后移，内外侧副韧带抵抗侧向力。落地时膝内扣 + 直腿，是 ACL 损伤的高危姿势。训练股四头、腘绳、臀中肌与落地技术，能显著降低风险。",p:["落地屈髋屈膝、膝与脚尖同向，是保护 ACL 的核心","股四头与腘绳力量平衡很重要","女性 ACL 损伤率更高，与骨盆宽、落地模式有关"],m:"落地时膝盖内扣还伸直，把 ACL 放在最危险的位置。",q:{a:"前交叉韧带（ACL）的主要作用是？",o:["限制胫骨向前移位","限制踝背屈","伸膝"],i:0,w:"ACL 防止胫骨相对股骨过度前移，也限制旋转。"}},
{id:"ana-19",s:"解剖",lv:3,t:"腰椎与髋铰链",b:"腰椎的结构适合承重与小幅活动，不适合大幅屈伸与旋转。所谓「髋铰链」就是屈髋不屈腰：臀往后送、脊柱保持中立、重量靠腿和臀承担。硬拉、RDL、壶铃摆荡都应该是铰链动作。",p:["弯腰搬重物时，先屈髋屈膝、背部中立","腰椎反复屈伸+负重，是腰伤的高风险组合","练好铰链，日常搬东西都在保护腰"],m:"弯腰直腿搬重物，用腰椎当铰链。",q:{a:"「髋铰链」动作的核心特征是？",o:["脊柱大幅屈曲","屈髋、臀部后移，脊柱保持中立","腰部旋转发力"],i:1,w:"铰链是髋关节折叠，腰椎保持中立，避免用腰代偿。"}},
{id:"ana-20",s:"解剖",lv:3,t:"骨盆前倾：别急着「矫正」",b:"骨盆前倾本身是正常解剖变异，很多人有轻度前倾却毫无症状。「骨盆前倾导致腰痛」的说法被夸大。真正相关的是：髋屈肌紧张、臀肌与核心弱、以及整体负荷管理。没有疼痛就不必强行「矫正体态」。",p:["体态是动态的，静态照片不能定义「有问题」","疼痛与体态的相关性很弱，别自己吓自己","改善方向：加强臀肌核心、减少久坐、管理负荷"],m:"照着网络教程天天「收骨盆」，越练越焦虑。",q:{a:"关于骨盆前倾，较准确的说法是？",o:["一定会导致腰痛，必须矫正","是常见解剖变异，无症状时不必强行矫正","只能通过手术解决"],i:1,w:"轻度前倾很常见，与疼痛无必然因果，重点在功能与负荷。"}},
{id:"ana-21",s:"解剖",lv:3,t:"肌肉不平衡与代偿",b:"当某块肌肉弱或紧张，相邻肌肉会「替它干活」，这就是代偿。常见：臀肌弱→腰部代偿伸髋；下斜方弱→上斜方耸肩；核心弱→腰部在硬拉中代偿。纠正思路：先找限制（活动度/力量/技术），再针对性补，而不是盲目「拉伸放松」。",p:["代偿不是「坏习惯」，是身体在找可行方案","先评估：活动度够不够？目标肌有没有在发力？","补弱 + 教技术，比单纯拉伸有效"],m:"哪里紧就拉哪里，拉完照旧代偿。",q:{a:"深蹲时腰先酸、臀没感觉，最可能的原因是？",o:["臀肌发力不足，腰部代偿伸髋","腰太强不需要练","深蹲不该练臀"],i:0,w:"臀肌募集不足时，竖脊肌会代偿完成伸髋，导致腰部先疲劳。"}},
{id:"ana-22",s:"解剖",lv:3,t:"拉伸：静态与动态",b:"训练前用动态拉伸（活动关节、提高体温、模拟动作），训练后用静态拉伸（每个部位 30–60 秒）改善柔韧性。静态拉伸放在训练前会短暂降低力量输出。柔韧性提升需要长期、规律、带到略有拉伸感的范围。",p:["练前动态、练后静态，是通用原则","拉伸不能「拉长肌肉」，是提高耐受与活动度","疼痛点不要硬压，神经症状禁止拉伸"],m:"训练前静态拉伸 20 分钟，然后发现深蹲更没力。",q:{a:"训练前更合适的准备方式是？",o:["长时间静态拉伸","动态拉伸与专项热身","完全不动直接上"],i:1,w:"动态拉伸能升高体温、激活神经，不会像长静态拉伸那样降低输出。"}},
{id:"ana-23",s:"解剖",lv:3,t:"运动链：力量如何传递",b:"人体是链条：脚→踝→膝→髋→躯干→肩→手。任何一环「漏力」，末端输出就打折。深蹲力量上不去，可能是踝背屈或胸椎活动度受限；出拳没力，可能是髋旋转与核心传递不足。训练要看链条，不只看单块肌肉。",p:["末端表现差，往回找最弱的一环","关节相邻原则：一个关节灵活，相邻关节多求稳定","全身性动作最能暴露链条短板"],m:"只练出拳的手臂，却不练髋与核心的旋转传递。",q:{a:"「运动链」观点最强调什么？",o:["每块肌肉单独训练","力量沿身体各环节传递，短板决定末端表现","只练末端肌肉"],i:1,w:"链条的强度由最弱环节决定，训练要兼顾传递效率。"}},
{id:"ana-24",s:"解剖",lv:3,t:"疼痛不等于损伤",b:"影像上的「椎间盘突出」「肩袖撕裂」在无症状人群中也很常见。疼痛是神经系统输出的保护信号，受负荷、睡眠、压力、恐惧影响。急性期适当减负荷，但长期完全不动会让组织更不耐受。渐进暴露是康复的核心。",p:["影像结果要结合症状，别只看报告吓自己","疼痛受情绪与睡眠影响，不是纯粹的结构问题","在可承受范围内逐步恢复活动，比长期卧床有效"],m:"看到报告写「突出」就彻底不敢动，结果越来越痛。",q:{a:"关于疼痛与影像学结果，较准确的是？",o:["影像有异常就一定疼","影像异常在无症状人群中也很常见，需结合症状判断","疼痛完全是心理作用"],i:1,w:"结构改变与疼痛并非一一对应，评估要结合功能与症状。"}}
]);

window.CARDS = (window.CARDS || []).concat([
/* ===== 解剖/生理 L4 进阶与实操 ===== */
{id:"ana-25",s:"解剖",lv:4,t:"骨与关节的分类：为什么关节形状决定动作",b:"全身 206 块骨通过关节连接。按结构分：纤维关节（颅骨缝，几乎不动）、软骨关节（椎间盘、耻骨联合，微动）、滑膜关节（肩、髋、膝、肘，大幅活动）。滑膜关节再按形状分：球窝（肩、髋，多方向）、铰链（肘、指，单轴）、车轴（桡尺，旋转）、椭圆（腕）、鞍状（拇指）、平面（腕骨间，滑动）。形状决定能做什么动作，也决定哪里容易受伤。",p:["球窝关节最灵活也最不稳（肩最容易脱位）","铰链关节只做屈伸，强行旋转就伤（膝关节旋转伤半月板）","多数「动作做不出来」不是肌肉短，是关节结构不允许"],m:"以为「肩膀能转 360 度」，其实肩关节的活动范围受关节盂与韧带限制，靠蛮力扭转会伤肩袖。",q:{a:"肩关节为什么比髋关节更容易脱位？",o:["肩关节骨头更大","肩是浅窝的球窝关节，活动范围大但稳定性差","肩没有韧带"],i:1,w:"髋的髋臼深、包裹多；肩的关节盂浅而小，靠软组织维持稳定，所以灵活但不稳。"}},
{id:"ana-26",s:"解剖",lv:4,t:"肌肉收缩的三种类型：向心、离心、等长",b:"向心收缩：肌肉缩短产生力（拿起哑铃）。离心收缩：肌肉被拉长同时产生力（慢慢放下哑铃），能承受更大负荷，也是肌肉酸痛（DOMS）主要来源，但增肌效果很好。等长收缩：长度不变产生力（平板支撑、靠墙静蹲），对关节稳定和血压管理有价值。训练中三种都要有，尤其别只做向心。",p:["离心能承受约 1.2–1.5 倍于向心的负荷","「控制着放下」就是在练离心，别让重量自由落体","等长收缩是关节康复与稳定训练的常用手段"],m:"做卧推只会「推上去」，放下时直接砸下来——等于丢掉了一半训练效果。",q:{a:"慢慢放下哑铃这个动作，属于哪种收缩？",o:["向心收缩","离心收缩","等长收缩"],i:1,w:"放下时肌肉被拉长同时发力，即离心收缩，可承受更大负荷，也是主要增肌刺激之一。"}},
{id:"ana-27",s:"解剖",lv:4,t:"肌肉与动作对照：一招对应哪块肌肉",b:"记住几个高频对应：深蹲/腿举→股四头肌 + 臀大肌；硬拉/罗马尼亚硬拉→臀大肌 + 腘绳肌 + 竖脊肌；卧推→胸大肌 + 三角肌前束 + 肱三头肌；划船→背阔肌 + 菱形肌 + 肱二头肌；引体→背阔肌 + 肱二头肌；推举→三角肌 + 肱三头肌；侧平举→三角肌中束；弯举→肱二头肌；下压→肱三头肌。知道对应，才知道该练什么、哪里会先累。",p:["复合动作练多块，孤立动作补短板","「哪里先累」往往决定动作质量的上限","同一个动作换个角度，主要发力肌群就变了"],m:"想练胸却一直做俯卧撑加引体，结果背和手臂先累，胸几乎没刺激到。",q:{a:"想重点练背阔肌，下面哪个动作最直接？",o:["卧推","引体向上/高位下拉","腿举"],i:1,w:"引体与高位下拉是背阔肌的垂直拉动作，肩关节内收伸展是其主要功能。"}},
{id:"ana-28",s:"解剖",lv:4,t:"肩关节复合体：肩袖四块肌肉的作用",b:"肩袖由四块肌肉组成：冈上肌（外展启动）、冈下肌（外旋）、小圆肌（外旋）、肩胛下肌（内旋）。它们把肱骨头「吸」在关节盂上。肩痛最常见的原因之一是肩袖无力 + 肩胛控制差。练肩要同时练：外旋（弹力带外旋）、肩胛后缩下沉（划船、面拉）、上举（推举）。",p:["肩袖的作用是稳定，不是发力主力","外旋训练被长期忽视，是肩痛的高发缺口","肩胛骨不跟着转，肩峰下空间就会变小"],m:"只练推举和侧平举，从不练外旋与肩胛，越练肩越痛。",q:{a:"肩袖肌群的主要功能是？",o:["把手臂举过头顶","稳定肱骨头在关节盂内","让肩膀变宽"],i:1,w:"肩袖四肌共同把肱骨头稳定在浅小的关节盂上，是肩关节动态稳定的核心。"}},
{id:"ana-29",s:"解剖",lv:4,t:"髋与臀：臀中肌为什么是「膝盖的保护伞」",b:"臀大肌负责伸髋（站起、爬楼、硬拉）；臀中肌负责髋外展与骨盆稳定，走路时防止骨盆向对侧塌陷。臀中肌无力时，膝盖会内扣（外翻塌陷），跑步、深蹲时膝盖压力剧增。训练：侧向走（弹力带）、单腿臀桥、蚌式、单腿硬拉。",p:["臀中肌无力 → 膝盖内扣 → 膝痛与髌骨问题","单腿动作最能暴露臀中肌是否够用","久坐会让臀肌「失忆」，先激活再训练"],m:"深蹲时膝盖总是往里夹，一直怪膝盖，其实是臀中肌没力气拉住大腿。",q:{a:"深蹲时膝盖内扣，最可能缺的是？",o:["股四头肌力量","臀中肌等髋外展肌的控制","小腿肌肉"],i:1,w:"臀中肌负责髋外展与骨盆稳定，无力时大腿内旋内收，膝盖随之向内塌陷。"}},
{id:"ana-30",s:"解剖",lv:4,t:"膝关节与前交叉韧带：为什么会「断」",b:"膝关节主要是铰链关节，屈伸是主功能，旋转能力很有限。前交叉韧带（ACL）限制胫骨向前滑动与过度旋转，最常受伤机制是「减速 + 急停变向 + 膝外翻」——常见于篮球、足球、羽毛球。女性风险更高（骨盆宽、Q 角大、落地习惯）。预防靠神经肌肉训练：落地屈髋屈膝、膝对脚尖、单腿稳定。",p:["ACL 损伤多见于急停变向与落地膝内扣","落地时膝盖要对准脚尖，别向内塌","神经肌肉训练能显著降低受伤率（证据较强）"],m:"以为「热身拉伸就够了」，其实落地动作模式才是 ACL 受伤的关键。",q:{a:"前交叉韧带最典型的受伤场景是？",o:["慢慢下蹲","急停变向时膝盖内扣","平躺抬腿"],i:1,w:"减速变向时胫骨前移伴随膝外翻与旋转，是 ACL 断裂最常见的机制。"}},
{id:"ana-31",s:"解剖",lv:4,t:"踝与足弓：稳定的第一道地基",b:"踝关节背屈（脚尖朝上勾）不足会让深蹲时脚跟离地、膝盖内扣。足弓由骨骼 + 韧带 + 胫后肌维持，扁平足不一定需要矫正，但足弓塌陷会带来踝内侧与膝的连锁问题。训练：提踵（小腿三头肌）、单脚站立（本体感觉）、足趾抓毛巾（足内在肌）。",p:["踝背屈不足是深蹲「蹲不下去」的常见原因","足弓塌陷会向上影响到膝和髋","单脚站立是最便宜的本体感觉训练"],m:"深蹲一定要垫高脚跟才蹲得下去，却从不练踝背屈——垫高只是掩盖问题。",q:{a:"深蹲时脚跟总是离地，常见原因是？",o:["大腿没力气","踝关节背屈活动度不足","腰部太软"],i:1,w:"踝背屈受限时，身体为了保持重心只能抬脚跟；这也是膝内扣的诱因之一。"}},
{id:"ana-32",s:"解剖",lv:4,t:"脊柱与核心：腹压是怎么产生的",b:"核心不是「腹肌」，而是一个圆柱：前方腹横肌与腹直肌、后方竖脊肌与多裂肌、上方膈肌、下方盆底肌。吸气时膈肌下降、腹腔压力上升，形成「气囊」稳定脊柱。所以正确顺序是：吸气到腹部 → 收紧腹壁 → 保持压力下发力。只收腹不呼吸，腹压反而下降。",p:["核心稳定靠腹压，不靠「吸肚子」","膈肌是核心的一部分，呼吸训练就是核心训练","屏气发力适合大重量，但高血压者要谨慎"],m:"做硬拉时一直憋着肚子往里吸，结果腰反而更不稳。",q:{a:"核心稳定的「气囊效应」主要靠什么产生？",o:["把肚子吸进去","膈肌下降 + 腹壁收紧形成腹压","绷紧手臂"],i:1,w:"膈肌收缩下降与腹壁协同收紧，使腹腔压力升高，从内部支撑脊柱。"}},
{id:"ana-33",s:"解剖",lv:4,t:"本体感觉：为什么闭眼单脚站不住",b:"本体感觉是身体对「自己在哪、在动多少」的感知，来自肌梭（肌肉长度变化）、腱器官（张力）、关节感受器与皮肤。它决定了平衡、协调与受伤风险。训练方式：闭眼单脚站、不稳定平面、单腿硬拉、落地缓冲练习。踝扭伤后本体感觉会下降，所以康复必须练平衡。",p:["本体感觉可训练，且退化很快（久坐、受伤后）","闭眼单脚站 <10 秒提示平衡需加强","扭伤后不复训平衡，复发率明显升高"],m:"崴脚后只等消肿，从不练平衡，结果一年崴三次。",q:{a:"闭眼单脚站主要训练的是？",o:["肌肉力量","本体感觉与平衡","心肺耐力"],i:1,w:"去掉视觉输入后，身体必须更多依赖本体感受器维持平衡，这正是本体感觉训练。"}},
{id:"ana-34",s:"解剖",lv:4,t:"筋膜：有结构，但「筋膜放松治病」证据有限",b:"筋膜是包裹肌肉、器官的结缔组织网络，确实有痛觉感受器与力学传导作用。但「筋膜粘连导致疼痛」「筋膜刀/泡沫轴能重塑筋膜」的说法，目前证据等级多为 C（机制推断 + 小样本）。泡沫轴的有效性更可能来自神经调节与短暂的活动度提升，而非「撕开粘连」。可以练，但别把它当治病的核心。",p:["筋膜真实存在，但「松解治病」被夸大","泡沫轴的效果多为短期、神经性，不必神化","真正有效的是渐进负荷 + 活动度训练"],m:"以为「筋膜粘住了所以疼」，天天滚泡沫轴，却从不练力量——疼痛依旧。",q:{a:"关于泡沫轴放松，目前证据支持的说法是？",o:["能永久改变筋膜结构","能短期提升活动度、缓解紧张感，机制多为神经性","能治愈所有慢性疼痛"],i:1,w:"现有研究多显示短期活动度改善与痛阈变化，缺乏「结构性改变筋膜」的高质量证据。"}},
{id:"ana-35",s:"解剖",lv:4,t:"活动度不等于柔韧：你需要的是「能控制的范围」",b:"柔韧是被动能达到的最大范围（别人帮你压腿），活动度是主动能控制的范围（自己抬腿）。只练静态拉伸容易「松而不稳」；只练力量容易「紧」。理想做法：先获得范围（拉伸/关节松动），再在范围内加负荷（控制训练），最后整合进动作。",p:["被动范围大 ≠ 能用得上","拉伸后立刻做控制训练，效果才留得住","力量训练本身也能提升活动度（全幅度训练）"],m:"天天压腿劈叉，但深蹲还是蹲不下去——因为缺少在范围内发力的能力。",q:{a:"「活动度」和「柔韧」的关键区别是？",o:["活动度是被动范围","活动度是能主动控制的范围","两者完全一样"],i:1,w:"柔韧偏被动极限，活动度强调在范围内主动控制并承重，实际运动中更有用。"}},
{id:"ana-36",s:"解剖",lv:4,t:"疼痛科学：疼不等于组织坏了",b:"现代疼痛科学认为疼痛是大脑对「危险信号」的输出，受组织损伤、情绪、睡眠、压力、既往经验共同影响。影像上的「椎间盘突出」「肩袖撕裂」在无症状人群中也很常见。所以：疼痛需要评估，但不是「一疼就说明坏了」。急性期保护 + 渐进负荷，比长期静养更有效（多数肌骨问题）。",p:["影像异常在无症状人群中常见，不能单独解释疼痛","长期完全休息会让组织更弱、疼痛更久","渐进负荷是多数肌骨疼痛最有效的康复手段"],m:"拍片看到「椎间盘突出」就认定自己废了，其实很多人有同样影像却完全不痛。",q:{a:"关于疼痛，比较符合现代认识的是？",o:["疼一定是组织损伤","疼痛是大脑输出的保护信号，受多种因素影响","疼就应该完全静养"],i:1,w:"疼痛是神经系统的保护性输出，组织损伤只是输入之一，心理与睡眠等因素同样重要。"}},
{id:"ana-37",s:"解剖",lv:4,t:"结缔组织的适应：肌腱与韧带怎么变强",b:"肌腱与韧带血供差、适应慢，需要更长周期（数周到数月）与合适负荷。肌腱喜欢「慢速、较大负荷、少次数」的刺激（如 3 秒下放），而不是高频小重量。突然增加跑量或跳跃量，是肌腱炎（如跟腱、髌腱）最常见诱因。规则：每周增量不超过 10%–20%。",p:["肌腱适应比肌肉慢得多，别指望两周见效","慢速离心对肌腱更友好","跑量/跳跃量突增是肌腱炎主因"],m:"一个月没跑步，突然跑 10 公里，第二天跟腱疼——肌腱没跟上心肺。",q:{a:"肌腱适应的特点是？",o:["比肌肉快","比肌肉慢，需要数周到数月","不需要负荷"],i:1,w:"肌腱血供少、代谢慢，胶原重塑周期长，需要渐进且持续的负荷刺激。"}},
{id:"ana-38",s:"解剖",lv:4,t:"肌少症：30 岁后每年流失的肌肉",b:"30 岁后肌肉量每十年约减少 3%–8%，60 岁后加速。表现：握力下降、走路变慢、起身困难、容易跌倒。预防核心是两件事：抗阻训练（每周 2 次以上）+ 足够蛋白（1.0–1.2 克/公斤，老人可到 1.2–1.5）。这不是「老年问题」，而是从 30 岁就该开始的长期投资。",p:["肌肉流失从 30 岁就开始，不是老了才管","抗阻训练是唯一能逆转肌肉流失的手段","老人蛋白需求比年轻人更高，不是更低"],m:"觉得「年纪大了就该少动」，结果越不动越没力气，跌倒风险直线上升。",q:{a:"预防肌少症最有效的两项措施是？",o:["多走路 + 少吃","抗阻训练 + 足够蛋白质","只吃钙片"],i:1,w:"抗阻训练提供合成信号，蛋白质提供原料，两者缺一不可；单纯有氧不足以逆转肌肉流失。"}},
{id:"ana-39",s:"解剖",lv:4,t:"动作纠错的顺序：先地基，再发力",b:"看到一个动作问题（如深蹲膝内扣），纠错顺序应是：① 关节活动度（踝背屈、髋屈）→ ② 稳定控制（臀中肌、核心）→ ③ 动作模式（学习正确轨迹）→ ④ 负荷与技术。跳过前两步直接加重量，问题只会被放大。判断顺序的方法：先做无负重版本，看问题是否还在。",p:["活动度不够 → 先解决活动度，别急着加重量","无负重动作还有问题，说明是模式或控制问题","纠错要看「最先出现的代偿」，不是最后的结果"],m:"膝盖内扣就喊「膝盖用力往外推」，但根本原因是踝背屈不足，喊了也没用。",q:{a:"动作出现代偿时，合理的纠错顺序是？",o:["直接加重练到对","先查活动度，再查稳定控制，最后改动作模式","只做拉伸"],i:1,w:"活动度是地基，稳定性是控制，模式是执行；跳过前两者直接加负荷会把代偿固化。"}},
{id:"ana-40",s:"解剖",lv:4,t:"把解剖用起来：三个自查动作",b:"① 踝背屈测试：面对墙脚尖离墙 10 厘米，膝盖能否碰到墙而脚跟不离地——碰不到说明背屈受限。② 单腿臀桥：抬起一条腿做臀桥，骨盆是否向一侧掉——掉了说明臀中肌控制不足。③ 过头深蹲：双手举过头顶下蹲，看脚跟是否离地、膝盖是否内扣、手臂是否前掉——三个问题分别指向踝、髋、胸椎。",p:["三个自查动作，5 分钟能定位主要短板","测试结果决定先练什么，而不是先练「想练的」","每 4 周重测一次，看短板是否变化"],m:"一直练自己擅长的动作（比如只卧推），短板永远不暴露，瓶颈也就永远在。",q:{a:"过头深蹲时手臂往前掉，通常提示？",o:["腿没力气","胸椎活动度或肩关节活动度不足","核心太强"],i:1,w:"手臂前掉说明肩屈或胸椎伸展不足，身体用前倾代偿，属于活动度问题而非力量问题。"}}
]);

window.CARDS = (window.CARDS || []).concat([

 p:["每天至少 3 小时活动，其中 1 小时中高强度","项目多样化，别过早只练一项","用游戏化指令，比再来十次有效十倍"],
 m:"孩子静不下来往往不是问题，是运动量不够；高质量放电比强行安静更有用。",

{id:"kid-04",s:"儿童",lv:1,age:"7-9",t:"7–9 岁：协调与速度的黄金窗",

 p:["每周 3 次以上、每次 60 分钟中高强度活动","加入跳绳、变向、平衡练习","力量用自重练技术：深蹲、俯卧撑、引体"],

{id:"kid-05",s:"儿童",lv:1,age:"10-12",t:"10–12 岁：青春期前力量启蒙",
 b:"青春期前（未变声、未突增）是学力量技术的窗口：动作模式干净、负荷轻、次数适中。深蹲、髋铰链、推、拉、负重行走，用自重或小重量把技术练对。技术打好了，突增期才不会一练就伤。",
 p:["每周 2–3 次，每次 20–30 分钟","每个动作 1–3 组、8–15 次，技术优先","重点学髋铰链与深蹲，它们是力量动作的地基"],
 m:"不要照成人计划上重量；青春期前收益主要来自神经适应与技术，不是肌肉量。",
 q:{a:"青春期前力量训练的主要收益来自？",o:["神经适应与技术","肌肉横截面积增长","极限力量突破"],i:0,w:"激素水平限制肌肉增长，此阶段最大收获是把动作学对。"},
 ev:"A",ref:"国际儿童抗阻训练共识（Faigenbaum 等）"},
{id:"kid-06",s:"儿童",lv:1,age:"13-15",t:"13–15 岁：生长突增期，控制负荷",
 b:"身高长得快时，骨长肌不长，柔韧与协调会暂时变笨，这是正常的。此时负荷要控制：少做大量跳跃与极限重量，多做技术、柔韧与核心。若出现膝前痛、跟骨痛，先减量而不是硬扛。",
 p:["突增期避免连续高冲击训练","每周至少 2 次柔韧与活动度","力量训练保持中等负荷、规范技术"],
 m:"长个子的痛忍忍就好——生长相关疼痛需要调整负荷并评估，不是硬撑。",
 q:{a:"突增期最该做的是？",o:["控制冲击负荷、保技术","立刻上大重量追成绩","完全停止运动"],i:0,w:"骨头长得快、肌肉跟不上，此时最怕高冲击与失控负荷。"},
 ev:"B",ref:"青少年生长突增期训练负荷研究"},
{id:"kid-07",s:"儿童",lv:1,age:"16-18",t:"16–18 岁：接近成人，但别照搬",

 p:["力量训练每周 2–4 次，渐进加负荷","保证 8–10 小时睡眠","比赛期减量而不是加量"],
 m:"青少年用成人的狠练计划，短期可能出成绩，长期容易过度使用伤与倦怠。",
 q:{a:"16–18 岁训练最容易被忽略的是什么？",o:["恢复与睡眠","动作种类","器械品牌"],i:0,w:"这个年龄最常见的错误是练得够多、恢复得不够。"},
 ev:"B",ref:"青少年运动员训练负荷与损伤预防共识"},
{id:"kid-08",s:"儿童",lv:1,age:"0-18",t:"年龄不是唯一标准：看生物年龄与训练年龄",
 b:"同岁孩子发育差 2–3 年是常态。判断能不能加负荷，看三点：动作是否稳定、是否有疼痛、恢复是否跟得上。训练年龄（练了多久）比日历年龄更能决定进度。别拿别人家孩子当标尺。",
 p:["用能不能标准完成决定进阶，而不是几岁","每 4–6 周复盘一次动作质量","发育早不等于该多练"],
 m:"按年龄一刀切既不安全也不公平；同岁孩子的发育差可能超过两年。",
 q:{a:"决定能否加负荷最可靠的依据是？",o:["动作质量与恢复情况","日历年龄","身高体重"],i:0,w:"动作稳、不痛、恢复跟得上，才是进阶条件。"},
 ev:"B",ref:"青少年发育评估与训练进阶文献"},
{id:"kid-09",s:"儿童",lv:2,age:"7-18",t:"孩子练力量安全吗？看共识怎么说",
 b:"多项系统综述与国际共识结论一致：在合格指导、正确技术、渐进负荷下，儿童与青少年抗阻训练是安全的，能提高力量、骨密度、运动表现与自信心，不损害生长。风险来自无人监督、负荷失控与动作错误。",
 p:["有资质指导 + 技术优先 + 渐进负荷 = 安全","训练前热身、训练后放松，别省","关节痛超过 3 天要评估"],
 m:"力量训练伤生长板——规范训练下没有证据；失控的重复冲击才是风险来源。",
 q:{a:"儿童抗阻训练的主要风险来源是？",o:["无人监督与负荷失控","力量训练本身","训练次数太多"],i:0,w:"共识强调的不是禁止，而是指导、技术与负荷管理。"},
 ev:"A",ref:"国际共识与多项系统综述（Faigenbaum 等）"},
{id:"kid-10",s:"儿童",lv:2,age:"7-18",t:"自重优先：儿童力量动作库",

 p:["每次 5–6 个动作，覆盖蹲、推、拉、髋、核心","用能不能标准完成决定加不加难度","组间休息 60–90 秒"],
 m:"让孩子做网红高难度动作是伤害高发区；难度要和当前技术匹配。",
 q:{a:"儿童力量训练的合理起点是？",o:["自重动作与标准技术","器械极限重量","弹力带高强度间歇"],i:0,w:"自重动作能覆盖全身，且便于判断技术是否过关。"},
 ev:"B",ref:"儿童抗阻训练动作进阶指南"},
{id:"kid-11",s:"儿童",lv:2,age:"7-18",t:"跳跃与落地：最该教的一课",
 b:"落地技术差是青少年膝踝损伤的常见原因。教三件事：膝盖对准脚尖、屈髋屈膝缓冲、落地声音要轻。先学落地，再学跳。每周 2 次、每次 10 分钟的神经肌肉训练，能明显降低损伤率。",
 p:["落地要轻、稳、膝对脚尖","跳箱高度以能稳稳落地为准","把落地练习放进热身里"],
 m:"跳得高就行——不会落地的孩子，跳得越多伤得越快。",
 q:{a:"预防青少年膝踝损伤最有效的单项练习是？",o:["落地技术与神经肌肉训练","拉伸小腿","跑更多圈"],i:0,w:"神经肌肉训练是被反复验证的损伤预防手段。"},
 ev:"A",ref:"神经肌肉训练预防运动损伤系统综述与共识"},
{id:"kid-12",s:"儿童",lv:2,age:"10-18",t:"一般身体准备（GPP）：别只练专项",
 b:"GPP 是专项之外的基础体能：力量、速度、耐力、柔韧、协调都练一点。青少年只练一项容易局部过用。每周留 2 次给非专项训练，反而能让专项成绩更好、伤病更少。",
 p:["每周至少 2 次非专项体能","按力量、速度、耐力、柔韧轮换","专项赛季减量，而不是全停"],
 m:"早期专项化能短期出成绩，但过度使用伤与退出率更高。",
 q:{a:"GPP 的核心意思是？",o:["专项之外的基础体能","只练专项技术","只练力量"],i:0,w:"GPP 让身体各系统均衡发展，为专项提供底盘。"},
 ev:"B",ref:"早期专项化与 GPP 研究"},
{id:"kid-13",s:"儿童",lv:2,age:"6-18",t:"柔韧：不做被动硬压",
 b:"儿童天生柔韧好，不需要压腿压到疼。静态拉伸放在训练后，动态活动度放在训练前。压腿时憋气、被成人强压，是常见错误做法，容易拉伤。柔韧的目标是够用，不是劈叉。",
 p:["训练前做动态热身：摆腿、弓步走","训练后每个部位静态拉伸 20–30 秒","不追求劈叉式指标"],
 m:"越疼越有效——疼痛是保护信号，不是进度条。",
 q:{a:"柔韧训练的正确安排是？",o:["训练前动态、训练后静态","训练前静态硬压","只在比赛前拉一次"],i:0,w:"动态热身提高活动度与激活；静态拉伸更适合训练后放松。"},
 ev:"C",ref:"柔韧训练实践指南（证据强度中等）"},
{id:"kid-14",s:"儿童",lv:2,age:"3-18",t:"有氧：玩出来的心肺",
 b:"孩子不需要跑步机：追跑、骑车、游泳、球类、跳绳都能练心肺。6–17 岁建议每天 60 分钟中高强度活动，每周至少 3 天有高强度与肌力骨强化活动。把运动变成日常，而不是任务。",
 p:["每天 60 分钟中高强度，可拆分累计","每周 3 天高强度 + 3 天力量与骨强化","喘得说不出完整句子即为高强度"],
 m:"只上技术课不做有氧，体能会拖技术后腿。",
 q:{a:"WHO 对 6–17 岁的活动建议是？",o:["每天 60 分钟中高强度","每周 60 分钟","每天 10 分钟"],i:0,w:"每天累计 60 分钟中高强度，每周还要有力量和骨强化活动。"},
 ev:"A",ref:"WHO 5–17 岁身体活动指南"},
{id:"kid-15",s:"儿童",lv:2,age:"9-15",t:"膝前痛与跟骨痛：生长相关疼痛怎么办",
 b:"Osgood-Schlatter（胫骨结节骨软骨炎）与 Sever 病（跟骨骨骺炎）常见于 9–15 岁活跃孩子：跑跳后膝下或脚跟痛，按压更痛。多数是自限性的，原则是减量不停练：减少跳跃与冲刺，加强力量与柔韧，痛到影响走路才就医。",
 p:["疼痛不超过 3 分可继续，超过 5 分要减量","加强股四头肌与小腿力量","冰敷与合适鞋垫可缓解，别长期完全停运动"],
 m:"疼就彻底休息三个月——过度制动会让肌肉更弱、复发更快。",
 q:{a:"生长相关膝前痛的首选处理是？",o:["减量不停练 + 力量训练","完全停训三个月","贴膏药继续练"],i:0,w:"减量、练力量、维持活动，是这类疼痛的主流处理。"},
 ev:"B",ref:"运动医学儿科共识与临床指南"},
{id:"kid-16",s:"儿童",lv:2,age:"6-18",t:"热环境、脱水与运动安全",
 b:"儿童体表面积相对大、出汗率低，比成人更容易中暑。热天运动要提前补水、每 15–20 分钟喝几口、穿透气衣服、避开正午。出现头晕、恶心、停止出汗、意识模糊，立即停止、降温、就医。",
 p:["运动前 2 小时喝 300–500 毫升","每 15–20 分钟补 100–200 毫升","热适应需要 1–2 周逐步加量"],
 m:"出大汗才有效——脱水会直接降低表现，并显著增加中暑风险。",
 q:{a:"孩子运动中出现头晕、停止出汗，应该？",o:["立即停止、降温、就医","喝口水继续","坚持完成计划"],i:0,w:"停止出汗是热病危险信号，必须立即处理。"},
 ev:"A",ref:"ACSM 运动与热病共识、儿科运动医学指南"},
{id:"kid-17",s:"儿童",lv:3,age:"10-18",t:"格斗类项目对青少年的风险",
 b:"拳击、散打、柔道等对抗项目对青少年有价值：纪律、体能、自卫。但风险集中在头部撞击。原则是：不安排头部重击对练、护具齐全、教练有资质、有脑震荡处理流程。出现头痛、头晕、记忆模糊，当天必须停训并评估。",
 p:["青少年以技术与条件实战为主，避免头部连续重击","护齿、护头、缠手不可省","脑震荡后按分级重返流程，不提前复训"],
 m:"打出来的抗打击能力——抗打击不是练出来的，是伤出来的。",
 q:{a:"青少年对抗训练的首要安全原则是？",o:["避免头部重击与及时停训","多打实战才进步快","不用护具更真实"],i:0,w:"未经训练的头部重复受击是长期损伤的主要来源。"},
 ev:"B",ref:"格斗项目脑震荡共识与青少年运动安全指南"},
{id:"kid-18",s:"儿童",lv:3,age:"6-18",t:"书包、坐姿与脊柱侧弯",
 b:"没有可靠证据表明书包重量直接导致脊柱侧弯，但过重书包会引起颈肩不适。青少年特发性侧弯多在 10–16 岁被发现，靠前屈试验初筛、X 光确诊。发现双肩不等高、一侧肩胛突出，尽早就诊。",
 p:["书包重量不超过体重的 10–15%","双肩背、调短肩带、重心贴近背部","10–16 岁每年做一次前屈筛查"],
 m:"坐姿不端正导致侧弯——特发性侧弯病因不明，别把责任推给孩子。",
 q:{a:"脊柱侧弯初筛最常用的方法是？",o:["Adam 前屈试验","摸骨判断","拍视频看走路"],i:0,w:"前屈试验观察背部是否不对称，是公认的初筛手段。"},
 ev:"B",ref:"脊柱侧弯筛查共识（SRS）与书包负荷研究"},
{id:"kid-19",s:"儿童",lv:3,age:"6-18",t:"屏幕时间与体态：相关不等于因果",
 b:"长时间低头看屏幕会引起暂时性颈肩不适，但没有证据说它造成永久性体态变形。真正的问题是屏幕挤掉了运动时间。与其强制挺直，不如每 30–40 分钟起身活动、每天保证户外活动。",
 p:["每 30–40 分钟起身活动 2–3 分钟","每天户外 1 小时以上","把活动量当目标，而不是姿势标准"],
 m:"驼背是玩手机玩的——体态是多因素结果，恐吓式纠正反而让孩子抗拒运动。",
 q:{a:"关于屏幕与体态，最准确的说法是？",o:["相关但因果证据有限","已被证实导致驼背","与体态完全无关"],i:0,w:"横断面研究多为相关性，缺少因果证据。"},
 ev:"C",ref:"久坐与体态相关研究（因果证据有限）"},
{id:"kid-20",s:"儿童",lv:3,age:"6-18",t:"儿童肥胖：别用成人减脂法",
 b:"儿童肥胖的处理原则与成人不同：不节食、不称卡路里、不追求快速掉秤。以家庭为单位调整饮食结构与活动量，目标是身高追上来（维持体重、增加身高）。极端节食会影响生长发育与心理健康。",
 p:["目标设为维持体重 + 增加活动","全家一起改，不单独针对孩子","每月测身高体重看趋势，不看单次数字"],
 m:"少吃就能瘦——儿童限制饮食可能导致生长受限与暴食反弹。",
 q:{a:"学龄儿童超重，合理的首要目标是？",o:["维持体重、增加活动","快速减重 5 公斤","完全戒掉主食"],i:0,w:"儿童仍在生长，维持体重即可让身高追上，避免限制性节食。"},
 ev:"A",ref:"AAP 儿童肥胖临床实践指南"},
{id:"kid-21",s:"儿童",lv:3,age:"6-18",t:"补剂：儿童基本不需要",
 b:"均衡饮食的孩子不需要蛋白粉、肌酸、支链氨基酸。真正需要关注的是维生素 D（日照不足时）、铁（青春期女生、素食者）、钙（奶制品不足时）。任何补剂都要先问医生，别拿成人配方给孩子。",
 p:["优先食物：奶、蛋、肉、豆、蔬果","维生素 D 与铁按检测结果补","不买增高、促生长类产品"],
 m:"吃蛋白粉才能长肌肉——儿童力量增长主要靠神经适应与技术，蛋白质从三餐就够。",
 q:{a:"健康孩子最不需要的补剂是？",o:["蛋白粉与肌酸","日照不足时的维生素 D","缺铁时的铁剂"],i:0,w:"前两者在均衡饮食下并非必需；维生素 D 与铁按需补充才有意义。"},
 ev:"A",ref:"儿科营养学会与运动营养共识"},
{id:"kid-22",s:"儿童",lv:3,age:"6-18",t:"睡眠：最便宜的增肌与长个药",
 b:"生长激素在深睡眠时分泌最多；睡眠不足会降低表现、增加食欲与受伤风险。学龄儿童需要 9–12 小时，青少年 8–10 小时。青少年生理节律天然后移，早上起不来不是懒。固定作息、睡前一小时不看屏幕最有效。",
 p:["学龄 9–12 小时、青少年 8–10 小时","每天同一时间睡与起","睡前 1 小时无屏幕"],
 m:"少睡多练在青少年身上只会换来更多伤病与更差成绩。",
 q:{a:"青少年建议睡眠时长是？",o:["8–10 小时","6–7 小时","11–13 小时"],i:0,w:"学龄儿童 9–12 小时，青少年 8–10 小时。"},
 ev:"A",ref:"AASM 儿童青少年睡眠推荐"},
{id:"kid-23",s:"儿童",lv:3,age:"6-18",t:"教练与家长：说什么、别说什么",
 b:"孩子对评价极度敏感。有效反馈指向过程：这次落地很稳、你坚持完成了；无效反馈指向人：你怎么这么笨、别人都行。羞辱式执教短期有效、长期摧毁动机。让孩子自己说出一个改进点，比你讲十句都有用。",
 p:["夸过程与努力，不夸天赋","一次只给一个改进点","训练结束问今天最开心的是什么"],
 m:"严师出高徒——高压与羞辱提高退出率，不提高长期水平。",
 q:{a:"对孩子最有效的反馈方式是？",o:["指向过程的具体反馈","当众比较排名","指出缺点不表扬"],i:0,w:"过程反馈保护内在动机，也更容易被执行。"},
 ev:"B",ref:"自我决定理论与青少年运动动机研究"},
{id:"kid-24",s:"儿童",lv:3,age:"8-18",t:"8–18 岁 12 周家庭训练路线",
 b:"每周 3 次、每次 30 分钟，不需要器械：热身 5 分钟动态活动度 → 力量 15 分钟（深蹲、俯卧撑、臀桥、弓步、平板，各 2 组 8–12 次）→ 跳跃与落地 5 分钟 → 放松 5 分钟。每 2 周加 1 次重复或 1 组，第 12 周减量一周。",
 p:["第 1–4 周学动作，第 5–8 周加量，第 9–12 周巩固并减载","每周记录一次今天最顺的动作","疼痛超过 3 分就减量"],
 m:"一上来就追求练到累，前三周最容易受伤；先把动作做对，再谈强度。",
 q:{a:"这套路线第 12 周该做什么？",o:["减量一周","冲最大重量","加两次训练"],i:0,w:"周期末减载能让适应巩固，避免累积疲劳。"},
 ev:"B",ref:"儿童抗阻训练进阶与 GPP 实践框架"},
]);


window.CARDS = (window.CARDS || []).concat([
/* ===== 儿童/青少年 L4 分龄实操 ===== */
{id:"kid-25",s:"儿童",lv:4,age:"0-18",t:"分龄总表：0–18 岁该练什么、不该练什么",b:"0–3 岁：自由活动、爬、抓、走，不安排结构化训练；3–6 岁：跑跳、投掷、平衡（ABC 基础），以游戏为主，单次 10–20 分钟；7–9 岁：协调、灵敏、速度游戏，自重为主；10–12 岁：力量启蒙（自重 + 轻器械），学技术动作；13–15 岁：突增期，控制负荷、重视技术、不追求极限重量；16–18 岁：接近成人训练结构，可系统抗阻，但仍需技术监督。",p:["越小越靠游戏，越大越靠结构","青春期突增期是受伤高峰，负荷要克制","任何年龄都不做「成人减脂式」极端节食"],m:"让 6 岁孩子每天做 50 个俯卧撑，既不符合发育规律，也容易伤到兴趣。",q:{a:"7–9 岁孩子训练的重点应该是？",o:["大重量力量训练","协调、灵敏与速度游戏","长时间有氧耐力"],i:1,w:"这个阶段神经系统发育快，适合学动作与协调；力量与耐力应随后逐步加入。"}},
{id:"kid-26",s:"儿童",lv:4,age:"0-3",t:"0–3 岁：地板时间比任何课程都重要",b:"这个阶段的目标只有一个：让身体有机会动。每天累计 180 分钟各类活动（含爬、扶站、走），其中地板自由活动最关键。不要用学步车（影响髋与足弓发育，多国已限制），限制在婴儿车/餐椅里的时间每天不超过 1 小时。把玩具放在稍远处，让他自己爬过去拿。",p:["地板自由活动是 0–3 岁最好的「训练」","学步车被多国指南反对，弊大于利","每天被束缚在座椅里的时间要少于 1 小时"],m:"怕孩子磕碰，长期放在围栏里或学步车里，反而耽误了基本的动作发育。",q:{a:"0–3 岁最推荐的「运动」方式是？",o:["每天上早教体能课","地板自由活动与爬行走动","用学步车练走路"],i:1,w:"自由活动让婴幼儿按自身节奏发展动作模式，学步车会干扰自然发育且有安全隐患。"}},
{id:"kid-27",s:"儿童",lv:4,age:"3-6",t:"3–6 岁：跑、跳、投、抓——ABC 四件事",b:"Agility（灵敏）、Balance（平衡）、Coordination（协调）是这个阶段的主线。具体做法：沿直线走、单脚站 5–10 秒、双脚跳、跨小障碍、抛接大球、钻爬。每次 10–20 分钟，一天 2–3 次，全部以游戏形式进行。不要做负重训练、不要长时间重复单一动作。",p:["每天累计 180 分钟活动，其中 60 分钟中高强度","游戏是唯一合适的形式","不做负重、不做超长时间的静态拉伸"],m:"把「体能课」变成排队做动作，孩子两次就不想去了——失去兴趣是最失败的训练。",q:{a:"3–6 岁训练的核心三要素是？",o:["力量、耐力、柔韧","灵敏、平衡、协调","速度、爆发、增肌"],i:1,w:"该阶段神经发育为主，ABC（灵敏、平衡、协调）是最匹配的内容。"}},
{id:"kid-28",s:"儿童",lv:4,age:"7-12",t:"7–12 岁：协调与速度的黄金窗口",b:"这个阶段神经系统可塑性高，学动作快。重点练：跳绳、变向跑、接力游戏、球类基本技术、自重力量（俯卧撑跪姿、引体悬挂、深蹲）。速度训练以 10–20 米短距离冲刺、多次少组为好，每次总距离不超过 100–200 米。每周 3 次，每次 30–45 分钟。",p:["速度靠短距离、多次、充分休息","自重力量足够，不需要大重量","多种运动比单一专项更有利于长期发展"],m:"8 岁就只练一项运动，一年 300 天重复同一动作，容易过度使用伤与失去兴趣。",q:{a:"7–12 岁练速度，比较合理的安排是？",o:["一次跑 5 公里","10–20 米短距离冲刺，多次、充分休息","负重深蹲"],i:1,w:"速度训练靠神经募集，短距离、高质量、充分恢复才是关键，长距离反而练成耐力。"}},
{id:"kid-29",s:"儿童",lv:4,age:"13-15",t:"13–15 岁：突增期，力量可以练但要克制",b:"青春期身高突增时，骨骼生长快于肌肉与肌腱，柔韧性与协调性会暂时变差，是这个年龄段受伤高峰。可以开始系统抗阻（每周 2–3 次），原则：以自重与轻器械为主、先技术后重量、不做 1RM 极限测试、动作全程有监督。力量训练对青少年是安全的（多项共识支持），前提是技术与负荷合理。",p:["突增期协调变差是正常现象，不是「变笨了」","可以练力量，但先技术后重量，不做极限测试","这个阶段受伤多因负荷跳增，不是因为力量训练本身"],m:"听说「小孩练力量长不高」，于是完全不练，结果体态与力量基础都缺——这个说法没有证据支持。",q:{a:"13–15 岁进行力量训练，下面做法正确的是？",o:["直接做 1RM 极限测试","先掌握技术，用自重或轻器械，每周 2–3 次","完全不能练力量"],i:1,w:"青少年抗阻训练在技术监督下是安全的，关键是循序渐进、避免极限负荷。"}},
{id:"kid-30",s:"儿童",lv:4,age:"6-18",t:"儿童心肺：别用成人标准要求孩子",b:"6–17 岁每天应累计 60 分钟中高强度活动，其中每周至少 3 天包含高强度活动与增强肌肉骨骼的活动。儿童心肺特点是心率高、恢复快，但体温调节能力弱。判断强度用「说话测试」：能说完整句子=中等，只能说几个词=高强度。不要让孩子做长时间持续高强度（如成人式 HIIT 连做 30 分钟）。",p:["每天 60 分钟中高强度是基础量","用说话测试判断强度，比看心率更实用","儿童体温调节差，热天要缩短、补水、避高温"],m:"带 8 岁孩子跑 5 公里「练耐力」，其实对关节与心理都是负担。",q:{a:"判断孩子运动强度，最简单的方法是？",o:["看心率数字","说话测试：能不能说完整句子","看流了多少汗"],i:1,w:"说话测试不需要设备：能说整句是中等强度，只能说几个词是高强度，适合家长快速判断。"}},
{id:"kid-31",s:"儿童",lv:4,age:"6-18",t:"柔韧与热身：动态热身，别做长时间静态拉伸",b:"运动前做动态热身（5–10 分钟）：慢跑、开合跳、弓步走、手臂绕环、腿部摆动，让心率与体温升上来。长时间静态拉伸放在运动后。儿童柔韧性天生较好，不需要刻意「压腿」，过度压腿反而增加关节松弛风险。",p:["运动前动态热身，运动后再静态拉伸","儿童不需要刻意追求劈叉","热身目的是升温与激活，不是拉长肌肉"],m:"运动前压腿压 10 分钟再上场，结果肌肉被拉长却未激活，反而更容易拉伤。",q:{a:"运动前的热身，更推荐哪种？",o:["长时间静态拉伸","动态热身（慢跑、开合跳、弓步走）","直接开始高强度"],i:1,w:"动态热身提升体温与神经激活，静态拉伸更适合放在运动后恢复阶段。"}},
{id:"kid-32",s:"儿童",lv:4,age:"6-18",t:"儿童常见损伤：PEACE & LOVE 与「疼就停」",b:"儿童最常见的不是拉伤，而是过度使用伤：胫骨结节骨软骨炎（膝盖下方痛）、跟骨骨骺炎（脚后跟痛）、髌腱炎。处理原则：急性期 PEACE（保护、抬高、避免抗炎药过度使用、加压、教育），亚急性 LOVE（负荷、乐观、血管化运动、活动）。核心一句：疼就停，减量而不是硬撑。",p:["儿童运动伤多是「练太多太快」，不是「太脆弱」","疼就减量，硬撑会让炎症拖成慢性","冰敷主要用于短期止痛，不是「必须」"],m:"孩子膝盖下方疼，家长说「长身体正常，忍忍就好」，结果疼了半年。",q:{a:"孩子训练后膝盖下方持续疼痛，最合适的做法是？",o:["继续练，忍过去就好","减量、停止致痛动作，必要时就医评估","完全卧床一个月"],i:1,w:"多为过度使用伤，需要减量与调整负荷；长期硬撑会迁延不愈，完全卧床也不必要。"}},
{id:"kid-33",s:"儿童",lv:4,age:"6-18",t:"睡眠与生长：长个子和长力量都在夜里",b:"生长激素分泌高峰在深睡眠阶段。6–12 岁建议 9–12 小时，13–18 岁建议 8–10 小时。睡眠不足会降低运动表现、增加受伤风险、影响食欲调节（更容易吃多）。睡前一小时不看屏幕、固定作息、卧室暗而凉，是最有效的三条。",p:["生长激素主要在深睡眠分泌","6–12 岁 9–12 小时，13–18 岁 8–10 小时","睡眠不足会直接提高运动受伤风险"],m:"为了多练一小时而少睡一小时，结果恢复变差、力量不涨反降。",q:{a:"13–18 岁青少年每天建议睡眠时长是？",o:["6–7 小时","8–10 小时","12 小时以上"],i:1,w:"青少年睡眠需求高于成人，8–10 小时是主流指南推荐区间。"}},
{id:"kid-34",s:"儿童",lv:4,age:"6-18",t:"动机与心理：别用「减肥」和「惩罚」驱动孩子",b:"孩子坚持运动的三个动力：好玩、有进步感、有同伴。最破坏动力的是：把运动当惩罚（「不听话就去跑步」）、用体重羞辱（「你太胖了」）、只盯成绩。做法：给选择权（今天跳绳还是打球）、记录小进步（连续跳绳次数）、家长一起动。对体重超标的儿童，绝不节食，只调整结构与增加活动。",p:["兴趣与进步感比「为你好」有效得多","不谈体重羞辱，只谈能力与感受","家长一起动，比任何说教都管用"],m:"孩子一犯错就罚跑步，结果他把运动和痛苦绑在一起，一辈子不想动。",q:{a:"让孩子长期坚持运动，最有效的是？",o:["用体重批评激励他","让运动好玩、有进步感、有同伴","规定每天必须完成固定动作量"],i:1,w:"内在动机（乐趣、胜任感、归属感）才是长期坚持的基础，外在惩罚会破坏它。"}},
{id:"kid-35",s:"儿童",lv:4,age:"6-18",t:"学校与家庭怎么配合：三件具体事",b:"① 校内：争取每天一节体育课或课间活动，课间 10 分钟出去走；② 家庭：固定「家庭运动时间」（每周 3 次，每次 30 分钟，一起做）；③ 环境：把球、跳绳放在看得见的地方，把屏幕时间设上限（2–5 岁 <1 小时，学龄期也要有明确上限）。环境设计比意志力有效。",p:["把器材放在看得见的地方，使用率会明显上升","每周 3 次家庭运动时间，比报班更可持续","屏幕时间要有明确上限并全家遵守"],m:"给孩子报了三个运动班，但家里没有任何器材、全家都在刷手机——孩子很难独自坚持。",q:{a:"想让孩子多运动，环境上最有效的一招是？",o:["买更贵的装备","把球和跳绳放在看得见、拿得到的地方","每天口头提醒"],i:1,w:"环境的「可得性」直接影响行为发生率，减少启动阻力比反复提醒更有效。"}},
{id:"kid-36",s:"儿童",lv:4,age:"6-18",t:"特殊情况：哮喘、肥胖、注意力困难的儿童怎么练",b:"哮喘：热身充分、避免干冷空气直吹、随身带药、以间歇运动为主。肥胖儿童：不节食、不加羞辱，从每天 20 分钟快走 + 自重训练开始，重点在坚持。注意力困难（ADHD 倾向）：短时段（10–15 分钟）、高频次、结构化指令、运动后学习效率常更好。所有情况都要与医生/老师沟通，不自行诊断。",p:["哮喘儿童可以运动，关键是热身与药物准备","肥胖儿童的重点是「动起来 + 不节食」","短时段高频次的运动对注意力困难的孩子更友好"],m:"认为「哮喘不能运动」，反而让孩子的体能和自信都越来越差。",q:{a:"哮喘儿童运动时，最重要的准备是？",o:["完全避免运动","充分热身、随身带药、避免干冷空气直吹","只做静态拉伸"],i:1,w:"合理运动对哮喘儿童有益，关键在于预防诱发因素并做好药物与热身准备。"}}
]);

window.EX["kid-22"] = { e: "睡眠是长个和长力气的主场：6–12 岁建议 9–12 小时，13–18 岁 8–10 小时。长期少睡的孩子，反应慢、情绪差、受伤风险高，练得多也长不快。", n: "固定睡觉时间，睡前一小时不看屏幕；周末别补觉超过 1 小时以免打乱节奏。" };
window.EX["kid-23"] = { e: "孩子练得好不好，很大程度取决于大人怎么反馈。说「你今天深蹲比上周稳」比说「你怎么这么笨」有用得多；赛场上大喊指挥，往往让孩子更紧张、更容易失误。", n: "每次只夸一个具体的动作细节；比赛时少喊指令，赛后让孩子先说自己的感受。" };
window.EX["kid-24"] = { e: "8–18 岁的 12 周路线可以很朴素：每周 2 次力量（自重为主）+ 2 次跑跳或球类 + 每天 60 分钟活动 + 睡够。第四周、第八周各减量一周。这套安排不需要器械，也不影响长个。", n: "把这个节奏写进日历，先执行四周；孩子喊累就减量，别硬加。" };

window.EX = window.EX || {};
window.EX["kid-25"] = { e: "同样一周 3 次训练：5 岁的豆豆每次是「追泡泡 + 单脚站 + 抛接球」各 5 分钟；10 岁的哥哥是跳绳 + 自重深蹲 + 变向跑；15 岁的姐姐是深蹲 40 公斤 × 8 次 + 卧推 + 慢跑。三个人都在「练」，但内容完全不同，因为年龄决定内容。", n: "先确定孩子年龄落在哪一档，再照着那一档的内容安排，别照搬成人计划。" };
window.EX["kid-26"] = { e: "1 岁半的孩子被放在围栏里看平板，一天走不了几步；另一个孩子每天在地垫上爬、扶走、追球，18 个月就能小跑。差别不在天赋，在于每天有多少「自己动」的机会。", n: "今天把地垫铺开 20 分钟，玩具放远一点，让孩子自己爬过去拿。" };
window.EX["kid-27"] = { e: "4 岁的乐乐每天晚饭后玩 15 分钟：沿地板胶带直线走、单脚站数 5 下、双脚跳过小枕头、把大球抛给爸爸。三周后他能单脚站 10 秒、跳得更远——没有一节课，全是游戏。", n: "今晚玩 3 个游戏：直线走、单脚站、抛接球，每个 5 分钟。" };
window.EX["kid-28"] = { e: "9 岁的小宇原来只踢球，跑动多但一加速就被超。加了每周 2 次「10 米冲刺 × 6 次（每次间休息 40 秒）+ 跳绳 3 组」后，两个月内 30 米成绩快了 0.4 秒，球场上明显能摆脱。", n: "每周 2 次，每次做 6 个 10 米冲刺，中间充分休息。" };
window.EX["kid-29"] = { e: "14 岁男生半年长了 8 厘米，突然觉得「手脚不协调、投篮总歪」，家长以为退步了。其实骨骼快速生长让肌肉长度与协调暂时不匹配。给他降低负荷、多练协调与柔韧，三个月后协调恢复，力量也上来了。", n: "突增期先减 30% 负荷，加入协调与柔韧练习，别急着刷新纪录。" };
window.EX["kid-30"] = { e: "8 岁孩子跑 400 米后脸色发白、说头晕——因为儿童体温上升快、出汗率低。改成「跑 1 分钟、走 1 分钟」重复 8 次（间歇），同样刺激心肺，孩子跑完还能笑着说话。", n: "带孩子跑用「跑 1 分钟走 1 分钟」的间歇法，别一次跑到底。" };
window.EX["kid-31"] = { e: "足球队热身：原来全队压腿 10 分钟，改成慢跑 3 分钟 + 开合跳 20 次 + 弓步走 10 步 + 高抬腿 15 秒 + 侧向移动，队员上场后明显更「活」，前半场拉伤也少了。", n: "把赛前压腿换成「慢跑 + 开合跳 + 弓步走」三件套，共 5 分钟。" };
window.EX["kid-32"] = { e: "11 岁踢球的孩子膝盖下方（胫骨结节）疼了两周，家长让「忍忍」。检查是胫骨结节骨软骨炎，减量 + 停止跳跃动作 4 周后疼痛消失；如果继续练，可能拖成半年以上。", n: "孩子说某个点一按就疼，先停掉引起疼痛的动作 2 周。" };
window.EX["kid-33"] = { e: "两个孩子同样练球：一个每天睡 9.5 小时，一个每天 7 小时（刷手机到 11 点）。三个月后前者力量与专注度都更好，后者经常喊累、还拉伤过一次。", n: "今晚把睡前 1 小时的屏幕关掉，固定睡觉时间。" };
window.EX["kid-34"] = { e: "妈妈原来常说「你再胖就没人喜欢你了」，孩子越来越抗拒运动。改成「今天跳绳比上周多 5 个，厉害」，并和他一起跳，一个月后他自己会主动拿跳绳。", n: "今天只夸一个具体的进步数字，不提体重。" };
window.EX["kid-35"] = { e: "家里把跳绳挂在门后、球放在客厅角落，电视遥控器收进抽屉。一个月后孩子自己拿跳绳的次数从每周 1 次变成每天——环境变了，行为就变了。", n: "今天把一件运动器材放到客厅最显眼的位置。" };
window.EX["kid-36"] = { e: "哮喘的孩子想打球：热身 15 分钟（比队友长）、随身带缓解药、冬天戴围巾避免干冷空气直吹、用「跑 2 分钟走 1 分钟」的节奏。他打完了整场，没有发作。", n: "运动前热身时间加倍，并把药放在场边能看到的地方。" };

</script>
<script>
/* 四课学习中心 · 引擎 */
(function () {
  "use strict";
  var KEY = "sike.v1";
  var IV = [1, 2, 4, 7, 15, 30];           // box 1..6 对应间隔天数
  var SUBS = [
    { s: "健身", c: "#ff9f43" },
    { s: "拳击", c: "#ff5b6e" },
    { s: "营养", c: "#4ade80" },
    { s: "解剖", c: "#a78bfa" },
    { s: "儿童", c: "#38bdf8" }
  ];
  var SUBCOLOR = {};
  SUBS.forEach(function (x) { SUBCOLOR[x.s] = x.c; });
  var CARDS = (window.CARDS || []).slice();
  // 选项位置打散：源卡里正确答案多集中在 B，按 id 做确定性洗牌，
  // 保证同一张卡每次顺序一致（不会今天 B 明天 C），但整体分布均匀。
  CARDS.forEach(function (c) {
    var seed = 0;
    for (var k = 0; k < c.id.length; k++) seed = (seed * 31 + c.id.charCodeAt(k)) % 100000;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    var order = [0, 1, 2];
    for (var i = 2; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    var oldO = c.q.o, oldI = c.q.i;
    c.q.o = order.map(function (x) { return oldO[x]; });
    c.q.i = order.indexOf(oldI);
  });
  var MAP = {};
  CARDS.forEach(function (c) { MAP[c.id] = c; });

  /* ---------- 证据与元信息 ---------- */
  var EVID = window.EVID || {}, KEYM = window.KEY || {}, UPDM = window.UPD || {}, FRESH = window.FRESH || [];
  var HOOKM = window.HOOK || {};
  var EXM = window.EX || {};
  function egHtml(c) {
    var x = EXM[c.id];
    if (!x) return "";
    var h = '<div class="eg"><div class="egk">举个例子</div><div class="egt">' + esc(x.e) + "</div>";
    if (x.n) h += '<div class="nb"><b>新手先这样　</b>' + esc(x.n) + "</div>";
    return h + "</div>";
  }
  var VER = window.VER || { v: "2026.11", d: "2026-11-24" };
  function hookHtml(c) {
    var h = HOOKM[c.id];
    if (!h) return "";
    return '<div class="hook"><span class="hk">记住这句</span><span class="ht">' + esc(h) + "</span></div>";
  }
  function ring(pct, big, small) {
    var r = 46, cir = 2 * Math.PI * r;
    var p = Math.max(0, Math.min(100, Math.round(pct)));
    var off = cir * (1 - p / 100);
    return '<div class="ringwrap"><svg class="ring" viewBox="0 0 110 110" aria-hidden="true">' +
      '<circle class="rbg" cx="55" cy="55" r="' + r + '"/>' +
      '<circle class="rfg" cx="55" cy="55" r="' + r + '" stroke-dasharray="' + cir.toFixed(1) +
      '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>' +
      '<div class="rlabel"><b>' + big + "</b><span>" + small + "</span></div></div>";
  }
  function evOf(c) {
    if (c.ev) return [c.ev, c.ref || ""];
    if (EVID[c.id]) return EVID[c.id];
    return ["B", ""];
  }
  function evHtml(c) {
    var e = evOf(c);
    return '<span class="ev e' + e[0] + '" data-tip="' + esc(e[1] || "未标注依据") + '">证据 ' + e[0] + "</span>";
  }
  function evNote(c) {
    var e = evOf(c);
    return '<div class="ev-note"><b>依据</b>　' + esc(e[1] || "未标注") +
      '　<span class="dim2">A 强证据 / B 中等 / C 有限</span></div>';
  }
  function ageHtml(c) { return c.age ? '<span class="age">' + esc(c.age) + " 岁</span>" : ""; }
  function updHtml(c) { var y = UPDM[c.id]; return y ? '<span class="upd">↑ ' + y + " 更新</span>" : ""; }
  function metaRow(c) {
    var h = '<div class="metarow">' + evHtml(c) + ageHtml(c) + updHtml(c);
    if (KEYM[c.id]) h += '<span class="key-mark">必会</span>';
    return h + "</div>";
  }
  var AGES = (function () {
    var seen = {}, out = [];
    CARDS.forEach(function (c) { if (c.age && !seen[c.age]) { seen[c.age] = 1; out.push(c.age); } });
    out.sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
    return out;
  })();

  /* ---------- 日期 ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function addDays(s, n) {
    var p = s.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return dstr(d);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  /* ---------- 状态 ---------- */
  function blankState() {
    return {
      v: 1,
      cards: {},
      log: {},
      streak: { last: "", days: 0 },
      settings: { newPerDay: 3 },
      created: today()
    };
  }
  var S = load();

  function load() {
    var d = blankState();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return d;
      var o = JSON.parse(raw);
      if (o && typeof o === "object") {
        if (o.cards) d.cards = o.cards;
        if (o.log) d.log = o.log;
        if (o.streak) d.streak = o.streak;
        if (o.settings) d.settings = Object.assign(d.settings, o.settings);
        if (o.created) d.created = o.created;
      }
    } catch (e) { /* 坏数据就当新的 */ }
    return d;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("保存失败：浏览器存储被禁用"); }
  }
  function st(id) {
    if (!S.cards[id]) S.cards[id] = { box: 0, due: null, seen: 0, ok: 0, bad: 0, lapses: 0, note: "", last: null };
    return S.cards[id];
  }
  function logOf(d) {
    if (!S.log[d]) S.log[d] = { new: 0, rev: 0, ok: 0, bad: 0 };
    return S.log[d];
  }

  /* ---------- 队列 ---------- */
  function dueList() {
    var t = today();
    return CARDS.filter(function (c) {
      var s = S.cards[c.id];
      return s && s.box > 0 && s.due && s.due <= t;
    }).sort(function (a, b) {
      return (S.cards[a.id].due < S.cards[b.id].due) ? -1 : 1;
    });
  }
  function freshList() {
    return CARDS.filter(function (c) {
      var s = S.cards[c.id];
      return !s || s.box === 0;
    }).sort(function (a, b) {
      var oa = SUBS.findIndex(function (x) { return x.s === a.s; });
      var ob = SUBS.findIndex(function (x) { return x.s === b.s; });
      return (a.lv - b.lv) || (oa - ob) || (a.id < b.id ? -1 : 1);
    });
  }
  function newRoom() {
    var t = today();
    var done = S.log[t] ? S.log[t].new : 0;
    return Math.max(0, S.settings.newPerDay - done);
  }
  function queue() {
    return { due: dueList(), fresh: freshList().slice(0, newRoom()) };
  }

  /* ---------- 会话 ---------- */
  var view = "home";
  var sess = null;
  var filters = { q: "", sub: "all", state: "all", age: "all" };
  var openId = null;

  var EXTRA = 5;
  function startSession(mode, n) {
    var items = [];
    var k = n || 0;
    if (mode === "free") {
      var pool = CARDS.filter(function (c) { var s = S.cards[c.id]; return s && s.box > 0; });
      if (!pool.length) pool = CARDS.slice();
      pool = pool.sort(function () { return Math.random() - 0.5; }).slice(0, k || 10);
      pool.forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
    } else if (mode === "more") {
      k = k || EXTRA;
      freshList().slice(0, k).forEach(function (c) { items.push({ id: c.id, type: "new" }); });
      var room = k - items.length;
      if (room > 0) dueList().slice(0, room).forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
      if (!items.length) {
        CARDS.slice().sort(function (a, b) { return (st(a.id).due || "") < (st(b.id).due || "") ? -1 : 1; })
          .slice(0, k).forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
      }
    } else {
      dueList().slice(0, 40).forEach(function (c) { items.push({ id: c.id, type: "rev" }); });
      queue().fresh.forEach(function (c) { items.push({ id: c.id, type: "new" }); });
    }
    if (!items.length) { toast("今天没有任务，试试自由复习"); return; }
    sess = { items: items, i: 0, answered: false, picked: -1, stage: "read", results: [] };
    if (items[0].type === "rev") sess.stage = "quiz";
    view = "study";
    render();
  }

  function cur() { return sess.items[sess.i]; }

  function answer(idx) {
    if (!sess || sess.stage !== "quiz" || sess.answered) return;
    if (idx !== 0 && idx !== 1 && idx !== 2) return;
    var it = cur(); var c = MAP[it.id]; var s = st(c.id);
    var t = today(); var lg = logOf(t);
    sess.answered = true; sess.picked = idx;
    var ok = idx === c.q.i;
    s.seen = (s.seen || 0) + 1; s.last = t;
    if (ok) {
      s.ok = (s.ok || 0) + 1;
      s.box = Math.min((s.box || 0) + 1, 6);
      s.due = addDays(t, IV[s.box - 1]);
      lg.ok++;
    } else {
      s.bad = (s.bad || 0) + 1;
      s.lapses = (s.lapses || 0) + 1;
      s.box = 1;
      s.due = addDays(t, 1);
      lg.bad++;
    }
    if (it.type === "new") lg.new++; else lg.rev++;
    sess.results.push({ id: c.id, ok: ok });
    recordStudy();
    save();
    render(); // 重绘以显示反馈（保留 answered 状态）
  }

  function recordStudy() {
    var t = today();
    if (S.streak.last === t) return;
    if (S.streak.last === addDays(t, -1)) S.streak.days = (S.streak.days || 0) + 1;
    else S.streak.days = 1;
    S.streak.last = t;
  }

  function nextCard() {
    if (!sess.answered && sess.stage === "quiz") { toast("先选一个答案"); return; }
    sess.i++;
    sess.answered = false; sess.picked = -1;
    if (sess.i >= sess.items.length) { sess.done = true; render(); return; }
    sess.stage = sess.items[sess.i].type === "new" ? "read" : "quiz";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- 计算 ---------- */
  function mastery(sub) {
    var list = CARDS.filter(function (c) { return !sub || c.s === sub; });
    var m = list.filter(function (c) { var s = S.cards[c.id]; return s && s.box >= 3; }).length;
    var started = list.filter(function (c) { var s = S.cards[c.id]; return s && s.box > 0; }).length;
    return { m: m, started: started, total: list.length };
  }
  function todayStat() {
    var lg = logOf(today());
    var n = lg.ok + lg.bad;
    return { n: n, acc: n ? Math.round(lg.ok / n * 100) : 0, neu: lg.new, rev: lg.rev };
  }

  /* ---------- 渲染 ---------- */
  var app;
  function render() {
    app = document.getElementById("app");
    if (view === "study" && sess) app.innerHTML = sess.done ? viewDone() : viewStudy();
    else if (view === "lib") app.innerHTML = viewLib();
    else if (view === "skim") app.innerHTML = viewSkim();
    else if (view === "tools") app.innerHTML = viewTools();
    else if (view === "stats") app.innerHTML = viewStats();
    else app.innerHTML = viewHome();
    document.querySelectorAll("[data-tab]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === view);
    });
    syncSheet();
  }

  function dot(s) { return SUBCOLOR[s] || "#888"; }
  function tag(s) {
    return '<span class="tag" style="color:' + dot(s) + ';background:' + dot(s) + '1f">' + s + "</span>";
  }

  function restTip() {
    var n = todayStat().n;
    if (n < 24) return "";
    return '<div class="hook rest"><span class="hk">今天的量够了</span><span class="ht">你已经学了 ' + n +
      " 张。这时候再刷，边际收益明显下降——记忆主要在睡眠里巩固，明早再来一遍比现在硬撑更牢。</span></div>";
  }

  function viewHome() {
    var q = queue();
    var n = q.due.length + q.fresh.length;
    var ts = todayStat();
    var ma = mastery(null);
    var html = "";
    var doneN = ts.n, tgt = ts.n + n;
    var pct = tgt ? doneN / tgt * 100 : 100;
    html += '<div class="card hero">';
    html += '<div class="row hero-top"><span class="chip"><span class="dot" style="background:var(--acc)"></span>今日任务</span>' +
      '<span class="spacer"></span><span class="dim2" style="font-size:12.5px">' + today() + "</span></div>";
    html += '<div class="hero-main"><div class="hero-txt">';
    if (n > 0) {
      html += '<div class="h1">今天还有 <em class="bignum">' + n + "</em> 张</div>";
      html += '<div class="muted">新卡 <b class="c-fit">' + q.fresh.length + '</b> 张 · 到期复习 <b class="c-acc">' + q.due.length + "</b> 张</div>";
    } else {
      html += '<div class="h1">今天的任务已完成 ✓</div>';
      html += '<div class="muted">想加练？可以自由复习，或去卡片库翻专题。</div>';
    }
    html += '<div class="stat">' +
      '<div><div class="k">连续打卡</div><div class="v">' + (S.streak.days || 0) + '<span class="u"> 天</span></div></div>' +

      { k: "② 乘你的活动 / 劳动系数", v: "× " + f, d: "你选的是「" + lab + "」。参考：久坐 ×1.2、轻体力劳动 ×1.5、中体力 ×1.75、重体力 ×2.0。" },
      { k: "③ 得到维持热量（TDEE）", v: Math.round(tdee) + " 千卡", d: "保持体重不变每天要吃的量，也就是你的「基准线」。" },
      { k: "④ 选目标，得出你的数", v: "减脂 " + Math.round(cut) + " / 维持 " + Math.round(tdee) + " / 增肌 " + Math.round(bulk), d: "减脂 ×0.8（别低于基础代谢）、维持 ×1、增肌 ×1.1（每周涨 0.2–0.4 公斤就够）。" }
    ];
    return '<div class="guide">' +
      '<div class="gt">热量怎么算：四步走</div>' +
      steps.map(function (s) {
        return '<div class="gs2"><div class="gk2">' + s.k + '</div><div class="gv2">' + s.v + '</div><div class="gd2">' + s.d + '</div></div>';
      }).join("") +
      '<div class="hint" style="margin:10px 0 0">数字只是起点。按你选的目标吃两周，体重周平均没变就说明刚好；涨了减 200–300 千卡，掉了加 200–300 千卡。</div></div>';
  }

  function pathHtml() {
    var LVN = { 1: "L1 入门", 2: "L2 结构", 3: "L3 应用", 4: "L4 进阶" };

    SUBS.forEach(function (x) {

  function toolState() {
    if (!S.tool) S.tool = { sex: "m", age: 30, h: 175, w: 70, act: 1.375 };
    return S.tool;
  }

  function bmiBand(v) {
    if (!v) return { t: "—", c: "#94a3b8" };
    if (v < 18.5) return { t: "偏瘦", c: "#38bdf8" };
    if (v < 24) return { t: "正常", c: "#4ade80" };
    if (v < 28) return { t: "超重", c: "#facc15" };
    return { t: "肥胖", c: "#ff5b6e" };
  }

  function macroFor(kcal, w, hi) {
    var prot = Math.round(w * hi);
    var fat = Math.round(kcal * 0.25 / 9);
    var carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
    var tot = carb * 4 + prot * 4 + fat * 9;
    return { carb: carb, prot: prot, fat: fat, kcal: Math.round(tot) };
  }

  function calcHtml() {
    var t = toolState();
    var h = Number(t.h) || 0, w = Number(t.w) || 0, age = Number(t.age) || 0;
    if (h < 100 || w < 25) return '<div class="hint">填上身高和体重就能算了。</div>';
    var bmi = w / Math.pow(h / 100, 2);
    var band = bmiBand(bmi);
    var lo = 18.5 * Math.pow(h / 100, 2), hi = 23.9 * Math.pow(h / 100, 2);
    var bmr = 10 * w + 6.25 * h - 5 * age + (t.sex === "f" ? -161 : 5);
    var tdee = bmr * (Number(t.act) || 1.375);
    var cut = tdee * 0.8, bulk = tdee * 1.1;
    var goals = [
      { k: "减脂", kcal: cut, sub: "−20%，每周掉 0.3–0.7 公斤", c: "#38bdf8", p: 1.8 },
      { k: "维持", kcal: tdee, sub: "体重基本不变", c: "#4ade80", p: 1.6 },
      { k: "增肌", kcal: bulk, sub: "+10%，每周涨 0.2–0.4 公斤", c: "#ff9f43", p: 1.8 }
    ];
    var html = '<div class="kpis">' +
      '<div class="kpi"><span class="kk">BMI</span><b style="color:' + band.c + '">' + bmi.toFixed(1) + '</b><span class="kv" style="color:' + band.c + '">' + band.t + '</span></div>' +
      '<div class="kpi"><span class="kk">正常体重区间</span><b>' + lo.toFixed(0) + '–' + hi.toFixed(0) + '</b><span class="kv">公斤（BMI 18.5–23.9）</span></div>' +
      '<div class="kpi"><span class="kk">基础代谢</span><b>' + Math.round(bmr) + '</b><span class="kv">千卡／天</span></div>' +
      '<div class="kpi"><span class="kk">维持热量</span><b>' + Math.round(tdee) + '</b><span class="kv">千卡／天</span></div>' +
      '</div>';
    html += '<div class="goals">';
    goals.forEach(function (g) {
      var m = macroFor(g.kcal, w, g.p);
      html += '<div class="goal" style="--gc:' + g.c + '"><div class="gk">' + g.k + '</div>' +
        '<div class="gv">' + Math.round(g.kcal) + '<span>千卡</span></div>' +
        '<div class="gs">' + g.sub + '</div>' +
        '<div class="gm">碳水 ' + m.carb + 'g · 蛋白 ' + m.prot + 'g · 脂肪 ' + m.fat + 'g</div></div>';
    });
    html += '</div>';
    html += guideHtml(bmr, tdee, t, cut, bulk);
    html += '<div class="hint">BMI 分级用中国标准（24 超重、28 肥胖）；基础代谢用 Mifflin-St Jeor 公式，估算误差约 ±10%。结果是起点，用两周体重变化校正：不变就对了，涨了减 300，掉了加 300。</div>';
    return html;
  }

  function heatCells() {
    var t = new Date();
    var end = dstr(t);
    var startD = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 83);
    // 对齐到周一
    var dow = (startD.getDay() + 6) % 7;
    startD = new Date(startD.getFullYear(), startD.getMonth(), startD.getDate() - dow);
    var cells = [];
    var d = startD;
    while (dstr(d) <= end) {
      var k = dstr(d);
      var lg = S.log[k];
      var n = lg ? (lg.new + lg.rev) : 0;
      var lv = n === 0 ? "" : n <= 2 ? "l1" : n <= 5 ? "l2" : n <= 9 ? "l3" : "l4";
      cells.push('<i class="' + lv + '" title="' + k + " · " + n + ' 张"></i>');
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
    return cells.join("");
  }

      try {
        var o = JSON.parse(fr.result);
        var s = o.state || o;
        if (!s.cards || typeof s.cards !== "object") throw new Error("bad");
        S = Object.assign(blankState(), s);
        save(); render(); toast("导入成功，共 " + Object.keys(S.cards).length + " 张卡的记录");
      } catch (e) { toast("文件格式不对，导入失败"); }
    };
    fr.readAsText(file);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) {
      if (e.target.id === "sheet") closeSheet();
      return;
    }
    var act = el.getAttribute("data-act");
    if (act === "start") startSession("day");
    else if (act === "free") startSession("free", 10);
    else if (act === "more") startSession("more", EXTRA);
    else if (act === "home") { sess = null; view = "home"; render(); }
    else if (act === "toquiz") { sess.stage = "quiz"; render(); }
    else if (act === "opt") { answer(Number(el.getAttribute("data-i"))); }
    else if (act === "next") nextCard();
    else if (act === "open") { openId = el.getAttribute("data-id"); syncSheet(); }
    else if (act === "close") closeSheet();
    else if (act === "savenote") {
      var id = el.getAttribute("data-id");
      var ta = document.getElementById("note");
      st(id).note = ta.value; save(); toast("笔记已保存");
    }
    else if (act === "sex") {
      toolState().sex = el.getAttribute("data-sex"); save();
      document.querySelectorAll("[data-sex]").forEach(function (b) { b.classList.toggle("on", b === el); });
      recalc();
    }
    else if (act === "export") exportData();
    else if (act === "reset") {
      if (confirm("确定清空全部学习进度与笔记吗？建议先导出备份。")) {
        S = blankState(); save(); render(); toast("已清空");
      }
    } else if (act === "tab") {
      var v = el.getAttribute("data-tab");
      if (v === "study" && (!sess || sess.done)) { sess = null; startSession("day"); return; }
      view = v; render();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "t-age" || e.target.id === "t-h" || e.target.id === "t-w") { recalc(); return; }
    if (e.target.id === "qbox") { filters.q = e.target.value; render(); var b = document.getElementById("qbox"); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "t-act") { recalc(); return; }
    if (e.target.id === "subsel") { filters.sub = e.target.value; render(); }
    if (e.target.id === "agesel") { filters.age = e.target.value; render(); }
    if (e.target.id === "statesel") { filters.state = e.target.value; render(); }
    if (e.target.id === "newsel") { S.settings.newPerDay = Number(e.target.value); save(); toast("每天新卡：" + S.settings.newPerDay + " 张"); }
    if (e.target.id === "imp" && e.target.files && e.target.files[0]) importData(e.target.files[0]);
  });

  document.addEventListener("keydown", function (e) {
    if (openId && e.key === "Escape") { closeSheet(); return; }
    if (view !== "study" || !sess || sess.done) return;
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    if (sess.stage === "read" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); sess.stage = "quiz"; render(); return; }
    if (sess.stage === "quiz") {
      if (!sess.answered && ["1", "2", "3"].indexOf(e.key) >= 0) { e.preventDefault(); answer(Number(e.key) - 1); return; }
      if (sess.answered && (e.key === " " || e.key === "Enter")) { e.preventDefault(); nextCard(); }
    }
  });

  // 标签切换按钮（顶栏）
  document.addEventListener("DOMContentLoaded", function () { render(); });

  window.__sikeRender = render;
  if (document.readyState !== "loading") render();
})();

</script>
</body>
</html>
